# Session 7
## Exceptions & Defensive Code

---

## try / except

```python
try:
    n = int(value)
except ValueError:
    n = None        # handle the bad case
```

When code might fail at runtime, wrap it. The `except` catches the named error.
Keep the `try` block **small** — only the line that can fail — so a catch can't
accidentally cover code you never meant to forgive.

`except ValueError: pass` is the minimal handler — a *visible, deliberate* "skip it."
Fine when skipping truly is the plan; if you might ever ask "what got skipped?", log it.

---

## Common exception types

| Exception | Happens when |
|---|---|
| `ValueError` | right type, bad value: `int("N/A")` |
| `TypeError` | wrong type: `5 > "5"` |
| `KeyError` | missing dict key: `d["nope"]` |
| `IndexError` | bad list index: `xs[99]` |
| `ZeroDivisionError` | `x / 0` |
| `FileNotFoundError` | `open("missing.csv")` |

---

## try / except / else / finally

```python
try:
    n = int(value)
except ValueError:
    print("not a number")
else:
    print("ok:", n)      # only if NO exception
finally:
    print("always runs")  # cleanup
```

---

## Raise your own

```python
def clean_likert(n):
    if not 1 <= n <= 5:
        raise ValueError(f"{n} not in 1–5")
    return n
```

`raise` throws an exception on purpose — caller decides how to handle it.

---

## EAFP vs LBYL

```python
# LBYL — "look before you leap"
if value.isdigit():
    n = int(value)

# EAFP — "easier to ask forgiveness" (Pythonic)
try:
    n = int(value)
except ValueError:
    n = None
```

Both valid. EAFP shines when "checking first" is hard or racy.

---

## assert (developer check, not validation)

```python
assert len(scores) > 0, "scores must not be empty"
```

For *your* sanity checks while developing. Can be disabled (`python -O`),
so **never** use `assert` to validate untrusted input — use `raise`.

---

## A first test with pytest

```python
# clean.py
def clean_likert(n):
    if not 1 <= n <= 5:
        raise ValueError("1–5 only")
    return n

# test_clean.py
import pytest
from clean import clean_likert

def test_valid():    assert clean_likert(3) == 3
def test_invalid():
    with pytest.raises(ValueError):
        clean_likert(9)
```
Run: `pytest`

---

## Your turn

`examples/session-07/practice.md`:
1. `safe_int(value)` returning int or None.
2. Clean a dirty survey list, collecting good values + a rejection log.
3. Write one `pytest` test.

---

# Going deeper
## Robust programs

---

## The exception family tree

```text
Exception
 ├── ValueError        ├── KeyError / IndexError (LookupError)
 ├── TypeError         └── OSError (FileNotFoundError, ...)
```

```python
try:
    n = int(raw)
except (ValueError, TypeError):   # catch a tuple of specifics
    ...
```

**Order matters**: `except` clauses are tried top-down — specific before broad, and a final
`except Exception as e:` only to log-and-stop, never to ignore.

---

## Custom exceptions that carry data

```python
class SurveyError(ValueError):
    def __init__(self, value, message):
        super().__init__(message)
        self.value = value            # keep the evidence

raise SurveyError(raw, f"{raw!r} is not a 1-5 rating")
```

Callers can catch `SurveyError` specifically — or `ValueError` broadly — and still see
*which* value broke.

---

## `raise ... from` — keep the cause

```python
try:
    n = int(cell)
except ValueError as e:
    raise SurveyError(cell, "bad rating cell") from e
```

The traceback shows **both**: your domain-level error on top, the real low-level cause
beneath. Future-you debugging at midnight says thanks.

---

## `finally` and the cleanup mindset

```python
try:
    f = open("data.csv")
    ...
finally:
    f.close()        # runs no matter what happened above
```

`with open(...)` (Session 8) is exactly this pattern, packaged. Rule: whoever acquires a
resource guarantees its release.

---

## `logging` beats `print` for diagnostics

```python
import logging
logging.basicConfig(level=logging.INFO, format="%(levelname)s: %(message)s")
logging.info("processing %s rows", len(rows))
logging.warning("rejected %r: out of range", raw)
```

- `print` is for the program's *output*; `logging` is for its *diary*.
- Levels (`DEBUG/INFO/WARNING/ERROR`) let you silence chatter without deleting lines.

---

## pytest, round 2

```python
import pytest
from clean import clean_likert

@pytest.mark.parametrize("bad", ["3", True, None, 0, 9])
def test_rejects(bad):
    with pytest.raises(ValueError):
        clean_likert(bad)
```

One test, five inputs, five reported results. Pattern: **arrange, act, assert** — and test the
*edges* (boundaries, wrong types), not the happy middle.

A function that only `print`s can't be asserted. **Return** the value, print at the
edge — that's what makes code testable (Session 5's `return` vs `print`, cashing in).

---

## Your turn — round 2

`examples/session-07/practice.md` → **In class — going deeper**:
fix an except-order bug, build `SurveyError` with `raise ... from`, switch the rejection log
to `logging`, and parametrize your tests.
---

## Traps recap

- **Never** bare `except:` — name the exception.
- Don't catch too broadly or swallow errors silently.
- `assert` ≠ input validation (use `raise`).
- Catch the *specific* error you expect.

## Summary
You can validate messy input and fail loudly when you should.

# 第 7 课
## 异常与防御式编程

---

## try / except

```python
try:
    n = int(value)
except ValueError:
    n = None        # 处理坏情况
```

代码可能在运行时失败，就包起来。`except` 捕获指定名字的错误。
`try` 块要保持**小**——只放可能失败的那一行——这样捕获就不会
误伤你本没打算原谅的代码。

`except ValueError: pass` 是最小化处理——一次*看得见的、故意的*"跳过"。
真要跳过时没问题；但凡你可能会问"跳过了什么？"，就改成记日志。

---

## 常见异常类型

| 异常 | 何时发生 |
|---|---|
| `ValueError` | 类型对、值不行：`int("N/A")` |
| `TypeError` | 类型不对：`5 > "5"` |
| `KeyError` | 字典缺键：`d["nope"]` |
| `IndexError` | 列表下标越界：`xs[99]` |
| `ZeroDivisionError` | `x / 0` |
| `FileNotFoundError` | `open("missing.csv")` |

---

## try / except / else / finally

```python
try:
    n = int(value)
except ValueError:
    print("not a number")
else:
    print("ok:", n)      # 仅当没有异常时
finally:
    print("always runs")  # 收尾清理
```

---

## 主动抛出

```python
def clean_likert(n):
    if not 1 <= n <= 5:
        raise ValueError(f"{n} not in 1–5")
    return n
```

`raise` 是有意抛出异常——如何处理交给调用者决定。

---

## EAFP vs LBYL

```python
# LBYL —— "三思而后行"
if value.isdigit():
    n = int(value)

# EAFP —— "先斩后奏"（Pythonic）
try:
    n = int(value)
except ValueError:
    n = None
```

两者都合法。当"事先检查"困难或有竞态时，EAFP 更亮眼。

---

## assert（开发者检查，不是输入校验）

```python
assert len(scores) > 0, "scores must not be empty"
```

给*你自己*开发时做的合理性检查。它可以被关闭（`python -O`），
所以**绝不要**用 `assert` 校验不可信输入——用 `raise`。

def clean_likert(n):
    if not 1 <= n <= 5:

# 更进一步
## 更稳健的程序

---

## 异常家族树

```text
Exception
 ├── ValueError        ├── KeyError / IndexError (LookupError)
 ├── TypeError         └── OSError (FileNotFoundError, ...)
```

```python
try:
    n = int(raw)
except (ValueError, TypeError):   # 一次捕获多个具体异常
    ...
```

**顺序很重要**：`except` 子句自上而下匹配——先具体、后宽泛；末尾的
`except Exception as e:` 只用来记录并停止，绝不用来无视。

---

## 携带证据的自定义异常

```python
class SurveyError(ValueError):
    def __init__(self, value, message):
        super().__init__(message)
        self.value = value            # 把证据留下

raise SurveyError(raw, f"{raw!r} is not a 1-5 rating")
```

调用者可以专门捕 `SurveyError`——也可以宽泛地捕 `ValueError`——
并且仍能看到*哪个*值出的问题。

---

## `raise ... from`——留住起因

```python
try:
    n = int(cell)
except ValueError as e:
    raise SurveyError(cell, "bad rating cell") from e
```

回溯信息会**两层都显示**：上面是你的领域级错误，下面是真正的底层起因。
凌晨调试的未来的你会感谢现在的你。

---

## `finally` 与清理思维

```python
try:
    f = open("data.csv")
    ...
finally:
    f.close()        # 无论上面发生什么都会运行
```

`with open(...)`（第 8 课）正是这套模式的成品包装。法则：谁申请资源，
谁保证释放。

---

## 诊断信息，`logging` 胜过 `print`

```python
import logging
logging.basicConfig(level=logging.INFO, format="%(levelname)s: %(message)s")
logging.info("processing %s rows", len(rows))
logging.warning("rejected %r: out of range", raw)
```

- `print` 输出程序的*结果*；`logging` 记录程序的*日记*。
- 级别（`DEBUG/INFO/WARNING/ERROR`）让你不删代码就能调低音量。

---

## pytest，进阶版

```python
import pytest
from clean import clean_likert

@pytest.mark.parametrize("bad", ["3", True, None, 0, 9])
def test_rejects(bad):
    with pytest.raises(ValueError):
        clean_likert(bad)
```

一个测试、五个输入、五条独立报告。套路：**准备、执行、断言**——
并且测*边界*（临界值、错误类型），而不是舒适区。

只会 `print` 的函数没法断言。让函数**返回**值、在边缘处打印——
这才是可测试的代码（第 5 课 `return` vs `print` 的回报）。

def safe_int(value):
    try:
        return int(value)
    except (ValueError, TypeError):
        return None

def clean_likert(n):
    if isinstance(n, bool) or not isinstance(n, int):
        raise ValueError(f"{n!r} not an int")
    if not 1 <= n <= 5:
        raise ValueError(f"{n} outside 1–5")
    return n

for r in raw:

        clean.append(clean_likert(safe_int(r)))
    except ValueError as e:
        rejected.append((r, str(e)))

print(rejected)   # [('N/A', ...), ('7', ...), ('', ...), ('two', ...)]
```

Read each snippet and decide what it does **before** you reveal the answer. To run and tinker with them line by line, open **&#9656; Traps — predict, then run** just below.

<details><summary>Reveal the result</summary>

`int()` parses INTEGER text only; '3.0' is not a valid int literal. Use `int(float(score))`.

<details><summary>Reveal the result</summary>

&rarr; `2`

Python uses banker's rounding (round half to EVEN): `round(2.5) == 2` but `round(3.5) == 4`. Watch this when summarising data.

Float error accumulates when you total components: 0.1+0.2+0.3 is 0.6000000000000001. Compare sums with `math.isclose`, or round for display.

<script type="text/markdown" id="quiz-md">
### Quiz — Exceptions & Defensive Code
1. Which exception does `int("N/A")` raise? Wrap `int(value)` so it returns `None` on
   failure.
2. Why is a bare `except:` dangerous?
3. When should you use `raise` vs `assert`?
4. Name the two validation styles — and give the EAFP version of converting `value` to an
   int.
5. Why must `except ValueError:` come before `except Exception:`?

<details><summary>Show answers</summary>

**Answers:** 1. `ValueError`;
`try: return int(value)` / `except (ValueError, TypeError): return None`.
2. It catches *everything* (even Ctrl+C and your own typos) and can hide bugs.
3. `raise` to validate real/untrusted input; `assert` for developer sanity checks (it can
be disabled with `python -O`). 4. LBYL ("look before you leap": `if value.isdigit():`)
vs EAFP ("easier to ask forgiveness"): `try: n = int(value)` / `except ValueError: ...`. 5. Handlers are tried top-down and `Exception` matches a `ValueError` too — placed first it would swallow everything, leaving the specific handler unreachable.

</details>
</script>
<script type="text/markdown" id="quiz-zh-md">
### Quiz — 异常与防御式编程
1. `int("N/A")` 抛哪种异常？把 `int(value)` 包一下，失败时返回 `None`。
2. 裸 `except:` 为什么危险？
3. 什么时候用 `raise`，什么时候用 `assert`？
4. 说出两种校验风格——并给出把 `value` 转成 int 的 EAFP 写法。
5. 为什么 `except ValueError:` 必须放在 `except Exception:` 前面？

<details><summary>Show answers</summary>

**答案：** 1. `ValueError`；
`try: return int(value)` / `except (ValueError, TypeError): return None`。
2. 它捕获*一切*（连 Ctrl+C 和你自己的手滑都算），会把 bug 藏起来。
3. 校验真实/不可信输入用 `raise`；开发者的自检用 `assert`（`python -O` 可关闭）。
4. LBYL（"三思而后行"：`if value.isdigit():`）vs EAFP（"先斩后奏"）：
`try: n = int(value)` / `except ValueError: ...`。5. 处理器自上而下匹配，
`Exception` 也能接住 `ValueError`——放前面会把一切吞掉，具体的处理器永远轮不到。

</details>
