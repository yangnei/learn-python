# Session 7
## Exceptions & Defensive Code

*Learn Python — Session 7 of 10 · one hour.*

---

## try / except

```python
try:
    n = int(value)
except ValueError:
    n = None        # handle the bad case
```

When code might fail at runtime, wrap it. The `except` catches the named error.

---

## Common exception types

| Exception | Happens when |
|---|---|
| `ValueError` | right type, bad value: `int("N/A")` |
| `TypeError` | wrong type: `5 > "5"` |
| `KeyError` | missing dict key: `d["nope"]` |
| `IndexError` | bad list index: `xs[99]` |
| `ZeroDivisionError` | `x / 0` |
| `FileNotFoundError` | `open("missing.csv")` |

---

## try / except / else / finally

```python
try:
    n = int(value)
except ValueError:
    print("not a number")
else:
    print("ok:", n)      # only if NO exception
finally:
    print("always runs")  # cleanup
```

---

## Raise your own

```python
def clean_likert(n):
    if not 1 <= n <= 5:
        raise ValueError(f"{n} not in 1–5")
    return n
```

`raise` throws an exception on purpose — caller decides how to handle it.

---

## EAFP vs LBYL

```python
# LBYL — "look before you leap"
if value.isdigit():
    n = int(value)

# EAFP — "easier to ask forgiveness" (Pythonic)
try:
    n = int(value)
except ValueError:
    n = None
```

Both valid. EAFP shines when "checking first" is hard or racy.

---

## assert (developer check, not validation)

```python
assert len(scores) > 0, "scores must not be empty"
```

For *your* sanity checks while developing. Can be disabled (`python -O`),
so **never** use `assert` to validate untrusted input — use `raise`.

---

## A first test with pytest

```python
# clean.py
def clean_likert(n):
    if not 1 <= n <= 5:
        raise ValueError("1–5 only")
    return n

# test_clean.py
import pytest
from clean import clean_likert

def test_valid():    assert clean_likert(3) == 3
def test_invalid():
    with pytest.raises(ValueError):
        clean_likert(9)
```
Run: `pytest`

## Traps recap

- **Never** bare `except:` — name the exception.
- Don't catch too broadly or swallow errors silently.
- `assert` ≠ input validation (use `raise`).
- Catch the *specific* error you expect.

## Summary
You can validate messy input and fail loudly when you should.

## Traps — predict, then reveal
Read each snippet and decide what it does **before** you reveal the answer. To run and tinker with them line by line, open **&#9656; Traps — predict, then run** just below.

<div class="trap">

**1.**

```python
score = '3.0'   # a value from a CSV
int(score)
```

<details><summary>Reveal the result</summary>

&rarr; `ValueError: invalid literal for int() with base 10: '3.0'`

`int()` parses INTEGER text only; '3.0' is not a valid int literal. Use `int(float(score))`.

</details>

</div>

<div class="trap">

**2.**

```python
score = 2.5
round(score)
```

<details><summary>Reveal the result</summary>

&rarr; `2`

Python uses banker's rounding (round half to EVEN): `round(2.5) == 2` but `round(3.5) == 4`. Watch this when summarising data.

</details>

</div>

<div class="trap">

**3.**

```python
weight = 0.1 + 0.2 + 0.3   # three grade components
weight == 0.6
```

<details><summary>Reveal the result</summary>

&rarr; `False`

Float error accumulates when you total components: 0.1+0.2+0.3 is 0.6000000000000001. Compare sums with `math.isclose`, or round for display.

</details>

</div>

<div class="trap">

**4.**

```python
enrolment = '1_000'
int(enrolment)
```

<details><summary>Reveal the result</summary>

&rarr; `1000`

Python accepts underscores as digit separators, even inside `int()` text.

</details>

</div>

### Quiz — Exceptions & Defensive Code
1. Which exception does `int("N/A")` raise? Wrap `int(value)` so it returns `None` on
   failure.
2. Why is a bare `except:` dangerous?
3. When should you use `raise` vs `assert`?
4. Name the two validation styles — and give the EAFP version of converting `value` to an
   int.

<details><summary>Show answers</summary>

**Answers:** 1. `ValueError`;
`try: return int(value)` / `except (ValueError, TypeError): return None`.
2. It catches *everything* (even Ctrl+C and your own typos) and can hide bugs.
3. `raise` to validate real/untrusted input; `assert` for developer sanity checks (it can
be disabled with `python -O`). 4. LBYL ("look before you leap": `if value.isdigit():`)
vs EAFP ("easier to ask forgiveness"): `try: n = int(value)` / `except ValueError: ...`.

</details>
