# Session 5
## Functions, Scope & Reusability

---

## Defining & calling

```python
def class_average(scores):
    """Return the mean of a list of scores."""
    return sum(scores) / len(scores)

class_average([91, 58, 73])     # 74.0
```

🧠 A function is a formula/coding-scheme: same input → same output.

---

## return vs print

```python
def avg(xs): return sum(xs) / len(xs)   # hands value back
def show(xs): print(sum(xs) / len(xs))  # just displays

x = avg([1,2,3])     # x = 2.0
y = show([1,2,3])    # prints 2.0, but y is None!
```

`print` shows; `return` gives the value to the next step.

---

## Parameters: positional, keyword, default

```python
def grade(score, scale=100, passing=60):
    ...
grade(85)                 # uses defaults
grade(85, passing=50)     # keyword arg
```

⚠️ Defaults must be **immutable** (numbers, strings, `None`) — never `[]` or `{}`.

---

## *args / **kwargs

```python
def total(*args):        # any number of positionals -> tuple
    return sum(args)
total(1, 2, 3)           # 6

def tag(**kwargs):       # any number of keywords -> dict
    return kwargs
tag(name="Ana", gpa=3.9) # {'name':'Ana','gpa':3.9}

func(*my_list)           # unpack list into args
func(**my_dict)          # unpack dict into kwargs
```

---

## TRAP: mutable default argument 😱

```python
def add_student(name, roster=[]):    # ❌
    roster.append(name)
    return roster

add_student("Ana")    # ?
add_student("Ben")    # ?  ← does the list persist? (Traps below)
```

The default `[]` is created **once**, at definition. Fix on next slide.

---

## The fix: default to None

```python
def add_student(name, roster=None):   # ✅
    if roster is None:
        roster = []
    roster.append(name)
    return roster
```

**Rule:** mutable default? Use `None` and create inside.

---

## Scope (LEGB) & globals

Python looks up names: **L**ocal → **E**nclosing → **G**lobal → **B**uilt-in.

```python
count = 0
def bump():
    count = count + 1   # 💥 UnboundLocalError
```
Assigning `count` makes it local. Avoid `global`; **return** a value and reassign instead.

---

## Docstrings & type hints

```python
def class_average(scores: list[float]) -> float:
    """Return the arithmetic mean of `scores`."""
    return sum(scores) / len(scores)
```

Type hints document intent. **They are NOT enforced at runtime** (`mypy` checks them).
Bigger projects standardize docstring fields (`:param:`, `:return:`, `:raises:`) so
tools like **Sphinx** can build a documentation website straight from the code.

---

## Your turn

`examples/session-05/practice.md`:
1. A small grade-functions module (with docstrings + hints).
2. Reproduce the mutable-default bug, then fix it.
3. `summary(*scores)` using `*args`.

---

# Going deeper
## Functions as values

---

## Functions are objects

```python
f = letter_grade            # no () — the function itself
f(85)                       # "B"
sorted(roster, key=grade_of)          # you've been passing functions since Session 4
stats = {"mean": class_average, "max": max}
stats["mean"]([91, 58, 73])           # dispatch by name
```

`key=lambda …` was never magic — you were handing `sorted` a function.

---

## `lambda`, honestly

```python
lambda s: s["score"]        # one expression, no statements, no docstring
```

Perfect as a throwaway `key=`. The moment it needs a second line or a name to be
understood — promote it to `def`.

---

## Closures: functions that remember

```python
def make_curver(bonus):
    def curve(score):
        return min(score + bonus, 100)
    return curve             # a function, with `bonus` baked in

gentle = make_curver(5)
harsh_year = make_curver(2)
gentle(96)                   # 100
```

A **factory** for functions. (The lambda-in-a-loop trap earlier is this — capture happens by
variable, not by value.)

---

## A first decorator

```python
def announce(f):
    def wrapper(*args, **kwargs):
        print(f"calling {f.__name__}{args}")
        return f(*args, **kwargs)
    return wrapper

@announce                    # sugar for: curve = announce(curve)
def curve(score):
    return min(score + 5, 100)
```

A decorator **wraps** a function with extra behavior. You'll *use* them constantly
(`@property`, `@cache`, `@pytest.mark...`) — now you know what the `@` does.

---

## Locking the call signature

```python
def curve(scores, *, bonus=5):     # everything after * is keyword-only
    ...
curve(xs, bonus=3)     # ✅ self-documenting
curve(xs, 3)           # 💥 TypeError — no mystery positional flags
```

Keyword-only arguments make call sites readable a month later.

---

## Docstrings that test themselves

```python
def class_average(scores):
    """Mean of scores.

    >>> class_average([90, 80, 70])
    80.0
    """
    return sum(scores) / len(scores)
```

`python -m doctest grades.py` runs every `>>>` example and complains on mismatch —
documentation that can't silently rot.

---

## Your turn — round 2

`examples/session-05/practice.md` → **In class — going deeper**:
your own `apply_to_all`, a curve factory, an `@announce` decorator, and a doctest.
---

## Traps recap

- Mutable default arg → use `None`.
- `print` ≠ `return` (forgot return → `None`).
- Assigning a global inside a function → `UnboundLocalError`.
- Type hints aren't enforced.

## Summary
You can write reusable, documented, reproducible functions.
**Next:** Session 6 — recursion.

---

## Homework (before Session 6)

*Outside class — it doesn't count toward class time. Full specs + solutions: `examples/session-05/practice.md` → **Homework**.*

1. **A tiny stats library** — `validate_score`, `curve`, `summarize`, with docstrings + type hints.
2. **`mean_ignoring_none(*values)`** — `*args` meets data cleaning.
3. **Scope-prediction drill** — say what prints *before* you run it.

# 第 5 课
## 函数、作用域与复用

---

## 定义与调用

```python
def class_average(scores):
    """Return the mean of a list of scores."""
    return sum(scores) / len(scores)

class_average([91, 58, 73])     # 74.0
```

🧠 函数就是公式/编码方案：同样的输入 → 同样的输出。

---

## return vs print

```python
def avg(xs): return sum(xs) / len(xs)   # 把值交回去
def show(xs): print(sum(xs) / len(xs))  # 只是显示

x = avg([1,2,3])     # x = 2.0
y = show([1,2,3])    # 打印 2.0，但 y 是 None！
```

`print` 是给人看的；`return` 才把值交给下一步。

---

## 参数：位置、关键字、默认值

```python
def grade(score, scale=100, passing=60):
    ...
grade(85)                 # 使用默认值
grade(85, passing=50)     # 关键字参数
```

⚠️ 默认值必须是**不可变的**（数字、字符串、`None`）——绝不要用 `[]` 或 `{}`。

---

## *args / **kwargs

```python
def total(*args):        # 任意个位置参数 -> 元组
    return sum(args)
total(1, 2, 3)           # 6

def tag(**kwargs):       # 任意个关键字参数 -> 字典
    return kwargs
tag(name="Ana", gpa=3.9) # {'name':'Ana','gpa':3.9}

func(*my_list)           # 把列表摊开成参数
func(**my_dict)          # 把字典摊开成关键字参数
```

---

## 陷阱：可变默认参数 😱

```python
def add_student(name, roster=[]):    # ❌
    roster.append(name)
    return roster

add_student("Ana")    # ？
add_student("Ben")    # ？ ← 列表会一直留着吗？（见下方陷阱区）
```

默认的 `[]` 只在**定义时创建一次**。下一页给出修法。

---

## 修法：默认用 None

```python
def add_student(name, roster=None):   # ✅
    if roster is None:
        roster = []
    roster.append(name)
    return roster
```

**法则：** 默认值想用可变对象？改用 `None`，在函数体内创建。

---

## 作用域（LEGB）与全局变量

Python 按此顺序查名字：**L**ocal → **E**nclosing → **G**lobal → **B**uilt-in。

```python
count = 0
def bump():
    count = count + 1   # 💥 UnboundLocalError
```
一旦给 `count` 赋值，它就成了局部变量。避免 `global`；**返回**新值再重新赋值。

---

## 文档字符串与类型标注

```python
def class_average(scores: list[float]) -> float:
    """Return the arithmetic mean of `scores`."""
    return sum(scores) / len(scores)
```

类型标注表达意图。**运行时并不强制执行**（`mypy` 可以检查）。
大型项目会规范文档字符串字段（`:param:`、`:return:`、`:raises:`），
这样 **Sphinx** 之类的工具能直接从代码生成文档网站。

---

## 轮到你了

1. 一个小型成绩函数库（带文档字符串 + 类型标注）。
2. 复现可变默认参数 bug，然后修好它。
3. 用 `*args` 写 `summary(*scores)`。

---

# 更进一步
## 函数也是值

---

## 函数是对象

```python
f = letter_grade            # 不加 () —— 函数本体
f(85)                       # "B"
sorted(roster, key=grade_of)          # 第 4 课起你就在传函数了
stats = {"mean": class_average, "max": max}
stats["mean"]([91, 58, 73])           # 按名字调度
```

`key=lambda …` 从来不是魔法——你一直在把函数递给 `sorted`。

---

## `lambda`，说实话

```python
lambda s: s["score"]        # 只能是一个表达式，没有语句和文档字符串
```

作为一次性的 `key=` 很完美。一旦需要第二行、或需要名字才能看懂——
就升级成 `def`。

---

## 闭包：会记事的函数

```python
def make_curver(bonus):
    def curve(score):
        return min(score + bonus, 100)
    return curve             # 返回函数，`bonus` 随身携带

gentle = make_curver(5)
harsh_year = make_curver(2)
gentle(96)                   # 100
```

一个函数**工厂**。（前面那个"循环里的 lambda"陷阱就是它——
捕获的是变量，不是值。）

---

## 第一个装饰器

```python
def announce(f):
    def wrapper(*args, **kwargs):
        print(f"calling {f.__name__}{args}")
        return f(*args, **kwargs)
    return wrapper

@announce                    # 语法糖：curve = announce(curve)
def curve(score):
    return min(score + 5, 100)
```

装饰器**包裹**一个函数，附加额外行为。你会不停地*用到*它们
（`@property`、`@cache`、`@pytest.mark...`）——现在你知道 `@` 是什么了。

---

## 锁定调用方式

```python
def curve(scores, *, bonus=5):     # * 之后的参数只能用关键字传
    ...
curve(xs, bonus=3)     # ✅ 一目了然
curve(xs, 3)           # 💥 TypeError —— 不许来历不明的位置参数
```

仅关键字参数让一个月后的调用代码依然可读。

---

## 能自我检验的文档字符串

```python
def class_average(scores):
    """Mean of scores.

    >>> class_average([90, 80, 70])
    80.0
    """
    return sum(scores) / len(scores)
```

`python -m doctest grades.py` 会运行每个 `>>>` 示例并在不符时报错——
文档不再会悄悄过期。

---

## 轮到你了——第二轮

`examples/session-05/practice.md` → **In class — going deeper**：
自己写 `apply_to_all`、一个加分工厂、一个 `@announce` 装饰器，以及一个 doctest。

---

## 陷阱回顾

- 可变默认参数 → 用 `None`。
- `print` ≠ `return`（忘了 return → `None`）。
- 在函数内给全局变量赋值 → `UnboundLocalError`。
- 类型标注不强制执行。

## 小结
你已经能写出可复用、有文档、可复现的函数。

&rarr; `[73, 73, 73]`

Closures capture the VARIABLE `score`, not its value; by call time the loop has left `score = 73`. Fix by binding it: `lambda score=score: score`.

<script type="text/markdown" id="quiz-md">
### Quiz — Functions, Scope & Reusability
1. What's the difference between `return` and `print`?
2. Why is `def f(x, items=[])` dangerous? What's the fix?
3. What does a function with no `return` statement return? Are type hints enforced at
   runtime?
4. `count = 0` at top level, then inside a function `count = count + 1` — what error, and
   why?
5. In one sentence: what does a decorator do, and what is `@d` above a `def f` sugar for?

<details><summary>Show answers</summary>

**Answers:** 1. `return` hands a value to the caller; `print` only displays it.
2. The default list is created once, at `def` time, and persists across calls; use
`items=None` then create inside. 3. `None`; and no — hints are documentation (`mypy`
checks them optionally). 4. `UnboundLocalError` — the assignment makes `count` local to
the function, so the right-hand side reads a local that doesn't exist yet. 5. It wraps a function with extra behavior; `@d` is exactly `f = d(f)`.

</details>
</script>
<script type="text/markdown" id="quiz-zh-md">
### Quiz — 函数、作用域与复用
1. `return` 和 `print` 的区别是什么？
2. `def f(x, items=[])` 为什么危险？怎么修？
3. 没有 `return` 语句的函数返回什么？类型标注在运行时强制吗？
4. 顶层 `count = 0`，函数内部写 `count = count + 1`——什么错误，为什么？
5. 一句话：装饰器做什么？`def f` 上方的 `@d` 是什么的语法糖？

<details><summary>Show answers</summary>

**答案：** 1. `return` 把值交给调用者；`print` 只是显示。2. 默认列表在 `def` 时
只创建一次，跨调用一直存在；用 `items=None` 然后在函数内创建。3. `None`；
不强制——标注是文档（`mypy` 可选检查）。4. `UnboundLocalError`——赋值让 `count`
成为函数局部变量，于是右侧读到一个尚不存在的局部名。5. 它给函数包上额外行为；
`@d` 就是 `f = d(f)`。

</details>
