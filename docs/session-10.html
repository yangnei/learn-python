# Session 10
## Modules, OOP & the Pythonic Toolkit

---

## Modules: split your code into files

```python
# grades.py
def letter_grade(score): ...
def class_average(scores): ...

# analysis.py
from grades import letter_grade, class_average
```

A `.py` file is a **module**. `import` reuses its functions elsewhere → no copy-paste.

---

## The `__main__` guard

```python
# grades.py
if __name__ == "__main__":
    print(letter_grade(85))   # runs ONLY when you execute grades.py directly
```

On `import grades`, `__name__` is `"grades"`, so the block is skipped.
One file can be both a runnable script *and* an importable library.

---

## OOP: model a domain entity

```python
class Student:
    def __init__(self, name, gpa):   # constructor
        self.name = name
        self.gpa = gpa
    def __str__(self):               # how it prints
        return f"{self.name} ({self.gpa})"

ana = Student("Ana", 3.9)
print(ana)        # Ana (3.9)
```

🧠 A class is an *operational definition*: the attributes + behaviors that "count" as a Student.
`self` = "this particular student."

---

## @property: validate on assignment

```python
class Student:
    ...
    @property
    def gpa(self):
        return self._gpa
    @gpa.setter
    def gpa(self, value):
        if not 0 <= value <= 4:
            raise ValueError("gpa must be 0–4")
        self._gpa = value
```

`ana.gpa = 5.0` now raises — the object defends its own integrity.
(`_gpa`'s leading underscore is the convention for "internal — hands off";
Python trusts you rather than enforcing it.)

---

## Inheritance

```python
class GradStudent(Student):
    def __init__(self, name, gpa, advisor):
        super().__init__(name, gpa)    # reuse parent setup
        self.advisor = advisor
    def __str__(self):
        return super().__str__() + f" — {self.advisor}"
```

`GradStudent` *is a* `Student` plus extra. `super()` calls the parent.

---

## The Pythonic toolkit (recap tour)

```python
[s.name for s in roster if s.gpa >= 2.0]   # comprehension (from S4)
list(map(lambda s: s.name.upper(), roster))# map: apply to all
list(filter(lambda s: s.gpa < 2.0, roster))# filter: keep matches
for i, s in enumerate(roster): ...          # index + item
for a, b in zip(names, scores): ...         # parallel
```

---

## Generators & walrus

```python
def gpas(students):
    for s in students:
        yield s.gpa          # one value at a time — low memory on big data

g = gpas(roster)
list(g)   # ?
list(g)   # ?  ← run it twice — what changes? (Traps below)

if (n := len(roster)) > 30:   # walrus := : assign + test in one step
    print(f"{n} students")
```

---

`examples/session-10/practice.md`:
1. Import from `grades.py`. 2. Build the validating `Student` class.
3. Add `GradStudent` with `super()`. 4. Comprehension + `map` + `filter` + a generator.

---

# Going deeper
## Designing with objects

---

## `__repr__` and friends

```python
class Student:
    def __repr__(self):                    # for developers (REPL, lists, logs)
        return f"Student({self.name!r}, {self.gpa})"
    def __eq__(self, other):
        return (self.name, self.gpa) == (other.name, other.gpa)
    def __lt__(self, other):               # "less than" — sorted() now just works
        return self.gpa < other.gpa

sorted(roster)                              # no key= needed anymore
```

Dunders make your objects behave like built-ins: printable, comparable, sortable —
even **addable**: define `__add__(self, other)` and `total = quiz + final` just works.
That's all "operator overloading" is.

---

## `@dataclass`, round 2

```python
from dataclasses import dataclass, field

@dataclass
class Student:
    name: str
    gpa: float = 0.0
    courses: list = field(default_factory=list)   # NOT courses: list = []
```

`default_factory=list` is the mutable-default rule (Session 5!) in class form — a fresh list
per instance. `@dataclass(frozen=True)` gives you an immutable record.

---

## `@classmethod`: alternate constructors

```python
@dataclass
class Student:
    name: str
    score: int

    @classmethod
    def from_row(cls, row):                # a CSV row (Session 8) -> an object
        return cls(row["name"], int(row["score"]))

roster = [Student.from_row(r) for r in csv.DictReader(f)]
```

`cls` is the class itself. Pattern: **file format at the edge, objects inside**.
(`@staticmethod` is the third flavor: a plain helper that lives in the class's
namespace — no `self`, no `cls`.)

---

## Composition over inheritance

```python
class Cohort:                    # a Cohort HAS Students  (composition ✅)
    def __init__(self, name):
        self.students = []

class GradStudent(Student):      # a GradStudent IS a Student (inheritance ✅)
    ...
```

Inherit only for a true *is-a*. When in doubt, hold objects inside other objects —
it stays flexible and testable.

---

## Class vs instance attributes — the rule

```python
class Course:
    school = "Ed School"         # class attr: SHARED by all — constants only
    def __init__(self):
        self.students = []       # instance attr: each object its own
```

Mutable data goes in `__init__`, always. (You met the shared-list trap — this is the law it
teaches.) And when you're tempted by a `global`: state that outlives one function call
belongs on an object instead.

---

## Generator pipelines

```python
def to_ints(rows):
    for r in rows:
        try:
            yield int(r)
        except ValueError:
            pass

def in_range(vals, lo=1, hi=5):
    yield from (v for v in vals if lo <= v <= hi)

clean = list(in_range(to_ints(raw)))    # nothing runs until consumed
```

Each stage yields to the next — **lazy**, constant-memory, works on a million-row file.
(Under the hood every `for` speaks one protocol: `iter()` to get an iterator, then
`next()` until empty. A generator is an object born speaking it.)

---

## From script to project

```text
survey_tool/
├── clean.py        # validation functions
├── stats.py        # summaries
├── report.py       # main: python3 report.py
└── tests/test_clean.py
```

One module per concern; `report.py` imports the rest; tests alongside. Inside
`report.py`, the convention:

```python
def main():                     # the program's real work, in one place
    ...

if __name__ == "__main__":
    main()
```

You already know every ingredient — this is just arranging them. (If `pytest` can't
discover `tests/`, drop an empty `__init__.py` inside — that marks it as a package.)

---

## Your turn — round 2

`examples/session-10/practice.md` → **In class — going deeper**:
sortable `Student`s, a dataclass with `default_factory`, `from_row`, and a two-stage
generator pipeline.
---

## Traps recap

- `self` is just "this instance" — not magic.
- A generator iterates **once**, then it's empty.
- The `__main__` guard keeps imported modules from running their demo code.
- Don't reach for a class when a function or dict will do.

## Summary
You can structure code into modules and classes and write idiomatic Python.
**Next (optional):** Session 11 — the capstone: put it all together.

---

```python

def class_average(scores): ...

```python
# grades.py
if __name__ == "__main__":

```

## OOP：为领域实体建模

```python
class Student:
    def __init__(self, name, gpa):   # 构造器
        self.name = name
        self.gpa = gpa
    def __str__(self):               # 打印时的样子
        return f"{self.name} ({self.gpa})"

ana = Student("Ana", 3.9)
print(ana)        # Ana (3.9)
```

🧠 类就是一份*操作性定义*：哪些属性和行为"算"一个 Student。
`self` = "眼下这一个学生"。

---

## @property：赋值时校验

```python
class Student:
    ...
    @property
    def gpa(self):
        return self._gpa
    @gpa.setter
    def gpa(self, value):
        if not 0 <= value <= 4:
            raise ValueError("gpa must be 0–4")
        self._gpa = value
```

现在 `ana.gpa = 5.0` 会抛错——对象捍卫自己的完整性。
（`_gpa` 的前导下划线是"内部实现，请勿触碰"的约定；
Python 选择信任你，而不是强制。）

---

## 继承

```python
class GradStudent(Student):
    def __init__(self, name, gpa, advisor):
        super().__init__(name, gpa)    # 复用父类的初始化
        self.advisor = advisor
    def __str__(self):
        return super().__str__() + f" — {self.advisor}"
```

`GradStudent` *是一种* `Student`，再加点料。`super()` 调用父类。

```python
[s.name for s in roster if s.gpa >= 2.0]   # 推导式（第 4 课）

list(filter(lambda s: s.gpa < 2.0, roster))# filter：留下符合的

g = gpas(roster)

list(g)   # ？ ← 跑两次——有什么变化？（见下方陷阱区）

# 更进一步
## 用对象做设计

---

## `__repr__` 和它的伙伴们

```python
class Student:
    def __repr__(self):                    # 给开发者看（REPL、列表、日志）
        return f"Student({self.name!r}, {self.gpa})"
    def __eq__(self, other):
        return (self.name, self.gpa) == (other.name, other.gpa)
    def __lt__(self, other):               # "小于" —— sorted() 直接可用
        return self.gpa < other.gpa

sorted(roster)                              # 不再需要 key=
```

双下方法让你的对象举止如内置类型：可打印、可比较、可排序——
甚至**可相加**：定义 `__add__(self, other)`，`total = quiz + final` 就能跑。
所谓"运算符重载"，仅此而已。

---

## `@dataclass`，进阶版

```python
from dataclasses import dataclass, field

@dataclass
class Student:
    name: str
    gpa: float = 0.0
    courses: list = field(default_factory=list)   # 千万别写 courses: list = []
```

`default_factory=list` 就是第 5 课"可变默认值"法则的类版本——每个实例
一个新列表。`@dataclass(frozen=True)` 给你一条不可变记录。

---

## `@classmethod`：备选构造器

```python
@dataclass
class Student:
    name: str
    score: int

    @classmethod
    def from_row(cls, row):                # CSV 行（第 8 课）-> 对象
        return cls(row["name"], int(row["score"]))

roster = [Student.from_row(r) for r in csv.DictReader(f)]
```

`cls` 就是类本身。套路：**文件格式挡在边缘，程序内部全是对象**。
（`@staticmethod` 是第三种口味：住在类命名空间里的普通函数——
没有 `self`，也没有 `cls`。）

---

## 组合优先于继承

```python
class Cohort:                    # Cohort 拥有 Student（组合 ✅）
    def __init__(self, name):
        self.students = []

class GradStudent(Student):      # GradStudent 是一种 Student（继承 ✅）
    ...
```

只有真正的"是一种"关系才继承。拿不准时，让对象持有对象——
更灵活，也更好测试。

---

## 类属性 vs 实例属性——铁律

```python
class Course:
    school = "Ed School"         # 类属性：所有实例共享 —— 只放常量
    def __init__(self):
        self.students = []       # 实例属性：每个对象自己一份
```

可变数据永远放进 `__init__`。（你踩过那个共享列表陷阱——这就是它教的法则。）
想用 `global` 的时候：能活过一次函数调用的状态，应该住在对象上。

---

## 生成器管道

```python
def to_ints(rows):
    for r in rows:
        try:
            yield int(r)
        except ValueError:
            pass

def in_range(vals, lo=1, hi=5):
    yield from (v for v in vals if lo <= v <= 5)

clean = list(in_range(to_ints(raw)))    # 消费之前，什么都不会跑
```

一级产出交给下一级——**惰性**、常数内存，百万行的文件也照吃。
（水面之下，每个 `for` 说的都是同一套协议：`iter()` 拿到迭代器，
`next()` 取到空为止。生成器就是天生会说这门话的对象。）

---

## 从脚本到项目

```text
survey_tool/
├── clean.py        # 校验函数
├── stats.py        # 汇总统计
├── report.py       # 主入口：python3 report.py
└── tests/test_clean.py
```

一个模块管一件事；`report.py` 导入其余部分；测试放旁边。`report.py` 里的惯例：

```python
def main():                      # 程序的正事，集中一处
    ...

if __name__ == "__main__":
    main()
```

每一种原料你都已经认识——这只是摆盘。（若 `pytest` 找不到 `tests/`，
在里面放一个空的 `__init__.py`，把它标记为包。）

- 生成器只能遍历**一次**，之后就空了。
- `__main__` 守卫防止被导入的模块跑演示代码。
- 函数或字典能解决的，别硬上类。

<script type="text/markdown" id="quiz-md">
### Quiz — Modules, OOP & the Pythonic Toolkit
1. In a class, what is `self`?
2. What happens if you iterate a generator twice?
3. Why doesn't a module's `if __name__ == "__main__":` block run when you `import` it?
4. `class Course: students = []` — what goes wrong when two `Course` objects enroll
   students, and what's the fix?
5. In a dataclass, why write `courses: list = field(default_factory=list)` instead of `= []`?

<details><summary>Show answers</summary>

**Answers:** 1. The current instance ("this particular object"). 2. The second pass is
empty — a generator is exhausted after one iteration. 3. On import, `__name__` is the
module's name, not `"__main__"`, so the block is skipped. 4. `students` is a *class*
variable shared by every instance, so both courses see one combined list; give each its
own in `__init__`: `self.students = []`. 5. A bare `[]` default would be created once and shared by every instance — the Session 5 mutable-default bug in class form; `default_factory` builds a fresh list per instance.

</details>
</script>
<script type="text/markdown" id="quiz-zh-md">
### Quiz — 模块、面向对象与 Python 惯用法
1. 类里的 `self` 是什么？
2. 把一个生成器遍历两次会怎样？
3. 模块的 `if __name__ == "__main__":` 块为什么在被 `import` 时不运行？
4. `class Course: students = []`——两个 `Course` 对象各自招生时会出什么问题？怎么修？
5. dataclass 里为什么写 `courses: list = field(default_factory=list)` 而不是 `= []`？

<details><summary>Show answers</summary>

**答案：** 1. 当前实例（"眼下这一个对象"）。2. 第二遍是空的——生成器遍历一次
就耗尽。3. 被导入时 `__name__` 是模块名，不是 `"__main__"`，块被跳过。
4. `students` 是所有实例*共享*的类变量，两门课看到的是同一份合并名单；在
`__init__` 里给每个实例自己的：`self.students = []`。5. 裸 `[]` 默认值只创建
一次、被所有实例共享——第 5 课的可变默认值 bug 换了件类的外衣；
`default_factory` 为每个实例现造一个新列表。

</details>
