# Session 10
## Modules, OOP & the Pythonic Toolkit

*Learn Python — Session 10 of 10 · one hour.*

---

## Modules: split your code into files

```python
# grades.py
def letter_grade(score): ...
def class_average(scores): ...

# analysis.py
from grades import letter_grade, class_average
```

A `.py` file is a **module**. `import` reuses its functions elsewhere → no copy-paste.

---

## The `__main__` guard

```python
# grades.py
if __name__ == "__main__":
    print(letter_grade(85))   # runs ONLY when you execute grades.py directly
```

On `import grades`, `__name__` is `"grades"`, so the block is skipped.
One file can be both a runnable script *and* an importable library.

---

## OOP: model a domain entity

```python
class Student:
    def __init__(self, name, gpa):   # constructor
        self.name = name
        self.gpa = gpa
    def __str__(self):               # how it prints
        return f"{self.name} ({self.gpa})"

ana = Student("Ana", 3.9)
print(ana)        # Ana (3.9)
```

🧠 A class is an *operational definition*: the attributes + behaviors that "count" as a Student.
`self` = "this particular student."

---

## @property: validate on assignment

```python
class Student:
    ...
    @property
    def gpa(self):
        return self._gpa
    @gpa.setter
    def gpa(self, value):
        if not 0 <= value <= 4:
            raise ValueError("gpa must be 0–4")
        self._gpa = value
```

`ana.gpa = 5.0` now raises — the object defends its own integrity.

---

## Inheritance

```python
class GradStudent(Student):
    def __init__(self, name, gpa, advisor):
        super().__init__(name, gpa)    # reuse parent setup
        self.advisor = advisor
    def __str__(self):
        return super().__str__() + f" — {self.advisor}"
```

`GradStudent` *is a* `Student` plus extra. `super()` calls the parent.

## Generators & walrus

```python
def gpas(students):
    for s in students:
        yield s.gpa          # one value at a time — low memory on big data

g = gpas(roster)
list(g)   # ?
list(g)   # ?  ← run it twice — what changes? (Traps below)

if (n := len(roster)) > 30:   # walrus := : assign + test in one step
    print(f"{n} students")
```

## Traps recap

- `self` is just "this instance" — not magic.
- A generator iterates **once**, then it's empty.
- The `__main__` guard keeps imported modules from running their demo code.
- Don't reach for a class when a function or dict will do.

```python
from dataclasses import dataclass

@dataclass
class Grade:
    course: str
    score: int

g1 = Grade('ED101', 91)
g2 = Grade('ED101', 91)
g1 == g2
```

<details><summary>Reveal the result</summary>

&rarr; `True`

`@dataclass` writes an `__eq__` that compares fields, so equal-valued grades are `==` (even though `g1 is g2` is False).

</details>

<script type="text/markdown" id="quiz-md">
### Quiz — Modules, OOP & the Pythonic Toolkit
1. In a class, what is `self`?
2. What happens if you iterate a generator twice?
3. Why doesn't a module's `if __name__ == "__main__":` block run when you `import` it?
4. `class Course: students = []` — what goes wrong when two `Course` objects enroll
   students, and what's the fix?

<details><summary>Show answers</summary>

**Answers:** 1. The current instance ("this particular object"). 2. The second pass is
empty — a generator is exhausted after one iteration. 3. On import, `__name__` is the
module's name, not `"__main__"`, so the block is skipped. 4. `students` is a *class*
variable shared by every instance, so both courses see one combined list; give each its
own in `__init__`: `self.students = []`.

</details>
