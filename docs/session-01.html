# Session 1
## Running Python, Variables & Types

---

## Why Python (for you)

- Free, readable, the lingua franca of research computing.
- Glue between your data, your stats, and your writing.
- Today: from zero to "I ran a program."

> Mantra for the whole course: **readability wins**.

---

## Two ways to run Python

1. **REPL** — type `python3`, get `>>>`, run one line at a time. Great for experiments.
2. **Script** — save `hello.py`, run `python3 hello.py`. Great for real work.

```python
# hello.py
print("Hello, researcher")
```

---

## Variables = labels on objects

```python
n = 30          # an int
mean = 3.7      # a float
name = "Ada"    # a str
passed = True   # a bool
missing = None  # "no value"
```

`=` is an **action** ("stick this label on that object"), **not** a math equation.
So `n = n + 1` is fine.

🧠 In stats you name quantities (`n`, `α`). Same idea — but the name can be re-pointed.

---

## The 5 core types

| Type | Example | Think |
|---|---|---|
| `int` | `30` | counts |
| `float` | `3.7` | measurements |
| `str` | `"Ada"` | text |
| `bool` | `True`/`False` | flags |
| `NoneType` | `None` | missing |

`type(x)` tells you which.

---

## Input & output

```python
name = input("Your name: ")        # ⚠️ ALWAYS a str
age  = int(input("Your age: "))    # convert right away
print("Hi", name, "— age", age)
```

**The #1 week-one trap:** `input()` gives you text.
`"5" + "3"` is `"53"`, not `8`.

---

## f-strings (use these)

```python
score = 87.456
print(f"{name} scored {score:.1f}")   # one decimal
print(f"{1234567:,}")                  # 1,234,567
print(f"{0.873:.1%}")                  # 87.3%
```

Cleaner than `+` concatenation and no type errors.

---

## Type conversion (casting)

```python
int("42")     # 42
float("3.14") # 3.14
str(42)       # "42"
int(3.9)      # 3   (truncates, doesn't round!)
round(3.9)    # 4
```

`int(input(...))` = read text, convert to number, in one step.

---

## Reading a traceback (don't panic)

```text
Traceback (most recent call last):
  File "x.py", line 3, in <module>
    age = int(input("Age: "))
ValueError: invalid literal for int() with base 10: 'thirty'
```

**Read the LAST line first.** It names the problem: `ValueError`, and the bad value `'thirty'`.

---

## Live demo & your turn

- Live: `greet.py`, then a "years to graduation" calculator. We'll break it once on purpose.
- You: `examples/session-01/practice.md` — build a GPA-or-BMI style script.

---

# Going deeper
## Numbers, strings & the tools around them

---

## Arithmetic, fully

| Op | Meaning | Example |
|---|---|---|
| `+ - *` | the usual | `3 * 7` → `21` |
| `/` | true division | `7 / 2` → `3.5` |
| `//` | floor division | `7 // 2` → `3` |
| `%` | remainder | `7 % 2` → `1` |
| `**` | power | `2 ** 10` → `1024` |

Precedence follows math (`**` first, then `* / // %`, then `+ -`) — when in doubt, **parenthesize**.
Update in place: `score += 5`, `count -= 1`, `total *= 2`.

---

## `%` earns its keep

```python
n % 2 == 0            # even?
student_id % 3        # 0, 1, or 2 -> rotate into 3 discussion groups
minutes = 130
print(minutes // 60, "h", minutes % 60, "min")   # 2 h 10 min
```

🧠 `//` and `%` together split a quantity into "whole units + remainder" — hours/minutes,
pages/sheets, groups/leftovers.

---

## Strings have methods

```python
name = "  aDA lovelace "
name.strip()          # "aDA lovelace"   (trim ends)
name.strip().title()  # "Ada Lovelace"   (chain them!)
"CS50".lower()        # "cs50"
"a,b,c".count(",")    # 2
"ana@uni.edu".startswith("ana")   # True
"@" in "ana@uni.edu"  # True  (membership)
len("data")           # 4
```

Methods **return a new string** — the original never changes (strings are immutable).
And strings multiply: `"ab" * 3` → `"ababab"` — `print("=" * 40)` draws a divider.

---

## f-strings, round 2 — aligned reports

```python
name, score, rate = "Ana", 91.456, 0.873
print(f"{name:<10}{score:>8.1f}{rate:>8.1%}")
# Ana           91.5   87.3%
```

- `:<10` pad left-aligned to 10 · `:>8` right-align to 8
- `:.1f` one decimal · `:,` thousands · `:.1%` percent
- `{score=}` prints `score=91.456` — debugging gold.

---

## `print()`, fine-tuned

```python
print("Ana", "Ben", "Cara", sep=" | ")   # Ana | Ben | Cara
print("Loading", end="...")              # no newline — the next print continues
print('She said "wow"')                  # swap quote styles...
print("She said \"wow\"")               # ...or escape with a backslash
print("line one\nline two")              # \n = a newline inside a string
```

- `sep=` joins the arguments (default: a space); `end=` closes the line (default: `"\n"`).
- `\n` and `\"` are **escape sequences** — one character wearing a backslash.

---

## Borrowing a toolbox: `import`

```python
import math
math.sqrt(144)     # 12.0
math.floor(3.9)    # 3
math.ceil(3.1)     # 4
math.pi            # 3.141592653589793
```

One line borrows a whole library. (The full import story — and `pip` — lands in Session 8.)

---

## Ask Python itself

```python
help(round)      # the manual for one function
dir(str)         # every method a string has
```

In the REPL, `_` holds the last result. These three habits replace half your web searches.

---

## Names that don't bite

- `snake_case` for variables and functions: `class_average`, not `ClassAvg`.
- Names say **what it is**: `n_students`, not `x`.
- Constants by convention: `MAX_SCORE = 100` (Python won't enforce it — the capitals warn humans).
- Comments explain **why**, not what: the code already says what.
- Before typing, sketch the steps in plain English (**pseudocode**) — then translate.

---

## Your turn — round 2

`examples/session-01/practice.md` → **In class — going deeper**:
formatting drill, a name normalizer, and the `%`-groups exercise.
---

## Traps recap

- `input()` → **always a string**; convert with `int()`/`float()`.
- `print(a, b)` (comma → spaces) vs `print(a + b)` (must be same type).
- `int(3.9)` truncates to `3`; use `round()` to round.

## Summary
You can run code, name values, convert types, format output, and read an error.
**Next:** Session 2 — the dynamic-typing traps.

---

## Homework (before Session 2)

*Outside class — it doesn't count toward class time. Full specs + solutions: `examples/session-01/practice.md` → **Homework**.*

1. **Unit converter** — a script that asks for a value and reports it converted, nicely f-string formatted.
2. **Traceback drill** — break three lines on purpose; for each, read the last line and name the error.
3. **Type-prediction table** — predict `type(...)` for ten expressions, then check in the REPL.

## 运行 Python 的两种方式

2. **脚本** —— 保存 `hello.py`，运行 `python3 hello.py`。适合正式工作。

```python
# hello.py

```

## 变量 = 贴在对象上的标签

```python
n = 30          # 一个 int（整数）
mean = 3.7      # 一个 float（浮点数）
name = "Ada"    # 一个 str（字符串）
passed = True   # 一个 bool（布尔值）
missing = None  # "没有值"
```

`=` 是一个**动作**（"把这个标签贴到那个对象上"），**不是**数学等式。
所以 `n = n + 1` 完全合法。

🧠 统计里你也给量命名（`n`、`α`）——思路相同，只是这里的名字可以随时改贴。

---

## 五大核心类型

| 类型 | 示例 | 联想 |
|---|---|---|
| `int` | `30` | 计数 |
| `float` | `3.7` | 测量值 |
| `str` | `"Ada"` | 文本 |
| `bool` | `True`/`False` | 开关标志 |
| `NoneType` | `None` | 缺失 |

`type(x)` 会告诉你 x 是哪种类型。

---

## 输入与输出

```python
name = input("Your name: ")        # ⚠️ 永远是 str
age  = int(input("Your age: "))    # 立即转换
print("Hi", name, "— age", age)
```

**第一周的头号陷阱：** `input()` 给你的是文本。
`"5" + "3"` 是 `"53"`，不是 `8`。

---

## f-string（请用这个）

```python
score = 87.456
print(f"{name} scored {score:.1f}")   # 保留一位小数
print(f"{1234567:,}")                  # 1,234,567
print(f"{0.873:.1%}")                  # 87.3%
```

比用 `+` 拼接干净得多，也不会有类型错误。

---

## 类型转换

```python
int("42")     # 42
float("3.14") # 3.14
str(42)       # "42"
int(3.9)      # 3   （截断，不是四舍五入！）
round(3.9)    # 4
```

`int(input(...))` = 读入文本、转成数字，一步完成。

# 更进一步
## 数字、字符串，以及它们周边的工具

---

## 算术运算，完整版

| 运算符 | 含义 | 示例 |
|---|---|---|
| `+ - *` | 常规运算 | `3 * 7` → `21` |
| `/` | 真除法 | `7 / 2` → `3.5` |
| `//` | 整除（向下取整） | `7 // 2` → `3` |
| `%` | 取余 | `7 % 2` → `1` |
| `**` | 乘方 | `2 ** 10` → `1024` |

优先级与数学一致（先 `**`，再 `* / // %`，最后 `+ -`）——拿不准时，**加括号**。
就地更新：`score += 5`、`count -= 1`、`total *= 2`。

---

## `%` 的用武之地

```python
n % 2 == 0            # 偶数？
student_id % 3        # 0、1 或 2 -> 轮流分进 3 个讨论组
minutes = 130
print(minutes // 60, "h", minutes % 60, "min")   # 2 h 10 min
```

🧠 `//` 和 `%` 搭配，把一个量拆成"整份 + 余数"——小时/分钟、页数/张数、分组/余下。

---

## 字符串自带方法

```python
name = "  aDA lovelace "
name.strip()          # "aDA lovelace"   （去掉首尾空白）
name.strip().title()  # "Ada Lovelace"   （可以链式调用！）
"CS50".lower()        # "cs50"
"a,b,c".count(",")    # 2
"ana@uni.edu".startswith("ana")   # True
"@" in "ana@uni.edu"  # True  （成员判断）
len("data")           # 4
```

方法**返回新字符串**——原来的从不改变（字符串不可变）。
字符串还能"乘"：`"ab" * 3` → `"ababab"` —— `print("=" * 40)` 画一条分隔线。

---

## f-string 进阶——对齐的报表

```python
name, score, rate = "Ana", 91.456, 0.873
print(f"{name:<10}{score:>8.1f}{rate:>8.1%}")
# Ana           91.5   87.3%
```

- `:<10` 左对齐补到 10 位 · `:>8` 右对齐到 8 位
- `:.1f` 一位小数 · `:,` 千位分隔 · `:.1%` 百分比
- `{score=}` 会打印 `score=91.456` ——调试神器。

---

## `print()`，微调版

```python
print("Ana", "Ben", "Cara", sep=" | ")   # Ana | Ben | Cara
print("Loading", end="...")              # 不换行——下一个 print 接着打
print('She said "wow"')                  # 换一种引号……
print("She said \"wow\"")                # ……或者用反斜杠转义
print("line one\nline two")              # \n = 字符串里的换行符
```

- `sep=` 决定参数之间的连接符（默认空格）；`end=` 决定行尾（默认 `"\n"`）。
- `\n` 和 `\"` 是**转义序列**——戴着反斜杠帽子的单个字符。

---

## 借用工具箱：`import`

```python
import math
math.sqrt(144)     # 12.0
math.floor(3.9)    # 3
math.ceil(3.1)     # 4
math.pi            # 3.141592653589793
```

一行代码借来一整个库。（`import` 的完整故事——连同 `pip`——在第 8 课。）

---

## 直接问 Python 本人

```python
help(round)      # 单个函数的说明书
dir(str)         # 字符串的全部方法
```

在 REPL 里，`_` 保存着上一个结果。这三个习惯能替你省下一半的网络搜索。

---

## 起不咬人的名字

- 变量和函数用 `snake_case`（蛇形命名）：`class_average`，而不是 `ClassAvg`。
- 名字要说明**它是什么**：`n_students`，而不是 `x`。
- 常量的约定写法：`MAX_SCORE = 100`（Python 不会强制——全大写是提醒人类的）。
- 注释解释**为什么**，而不是"是什么"：代码本身已经说明了是什么。
- 动手之前，先用大白话把步骤写出来（**伪代码**）——然后再翻译成代码。

---

H2 — the last lines, and what the names mean:
1. `ValueError: invalid literal for int() with base 10: 'ten'` — right *type* of argument, unusable value.
2. `TypeError: can only concatenate str (not "int") to str` — the types themselves don't fit the operation.
3. `NameError: name 'nmae' is not defined` — you used a name that was never assigned (usually a typo).

```python
# H3 — what type() says
7 / 2         # float — / always gives a float (3.5)
7 // 2        # int   — floor division of two ints (3)
7.0 // 2      # float — floored VALUE, float TYPE (3.0)
"7" * 2       # str   — repetition: '77', not math
int("7") * 2  # int   — 14
7 == 7.0      # bool  — True (numbers compare by value)
None          # NoneType
input         # builtin_function_or_method — a function is a value too
print("hi")   # prints hi, then evaluates to None (print returns nothing)
```

## Traps — predict, then reveal
Read each snippet and decide what it does **before** you reveal the answer. To run and tinker with them line by line, open **&#9656; Traps — predict, then run** just below.

<div class="trap">

**1.**

```python
score = '5'
bonus = '3'   # what input() would hand you
score + bonus
```

<details><summary>Reveal the result</summary>

&rarr; `'53'`

These are strings (as `input()` always returns): `+` concatenates text. Convert first: `int(score) + int(bonus)`.

</details>

</div>

<div class="trap">

**2.**

```python
age = 21
'Age: ' + age
```

<details><summary>Reveal the result</summary>

&rarr; `TypeError: can only concatenate str (not "int") to str`

You can't glue text to a number with `+`. Use an f-string — `f"Age: {age}"` — or `print('Age:', age)`.

</details>

</div>

<div class="trap">

**3.**

```python
gpa = 3.9
int(gpa)
```

<details><summary>Reveal the result</summary>

&rarr; `3`

`int()` truncates toward zero, it doesn't round. Use `round(gpa)` when you mean rounding.

</details>

</div>

<div class="trap">

**4.**

```python
name = 'ada'
name.upper()
name
```

<details><summary>Reveal the result</summary>

&rarr; `'ada'`

Strings are immutable: `.upper()` RETURNS a new string and leaves the original alone. Assign it back: `name = name.upper()`.

</details>

</div>

### Quiz — Running Python, Variables & Types
1. What type does `input("x: ")` return, always?
2. What does `"5" + "3"` evaluate to? How do you get `8`? And what is `int(3.9)`?
3. What does `f"{0.873:.1%}"` produce?
4. In a traceback, which line do you read first — and what two things does it tell you?
5. What are `17 // 5` and `17 % 5` — and name one practical use of `%`.

**Answers:** 1. `str`. 2. `"53"`; use `int("5") + int("3")`; `int(3.9)` is `3` (truncates,
doesn't round). 3. `"87.3%"`. 4. The **last** line: the exception's name (what kind of
problem) and the message (the offending value or detail). 5. `3` and `2`; `%` gives the remainder — even/odd tests, rotating IDs into k groups, splitting minutes into h + min.
