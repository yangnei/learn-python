# Session 4
## Data Structures

---

## Four containers, four jobs

| Type | Syntax | Mutable? | Use for |
|---|---|---|---|
| `list` | `[1, 2, 3]` | yes | ordered, changing collection |
| `tuple` | `(1, 2)` | no | fixed record / coordinates |
| `dict` | `{"k": v}` | yes | key → value lookup |
| `set` | `{1, 2, 3}` | yes | unique items |

---

## Lists & slicing

```python
xs = [10, 20, 30, 40]
xs[0]      # 10     xs[-1]   # 40 (last)
xs[1:3]    # [20, 30]   (stop excluded)
xs[:2]     # [10, 20]
xs[::-1]   # reversed
xs.append(50); xs.sort()      # mutate in place
```

⚠️ `xs.sort()` returns **None** — it sorts in place. Use `sorted(xs)` for a new list.

---

## Dicts = labeled records

```python
student = {"name": "Ana", "gpa": 3.9}
student["name"]              # "Ana"
student.get("major", "N/A")  # safe access with default
student["major"] = "Ed"      # add/update
for key, val in student.items(): ...
```

---

## A list of dicts = a dataset 🧠

```python
roster = [
    {"name": "Ana", "score": 91},
    {"name": "Ben", "score": 58},
]
```

Each dict = a **row/respondent**; each key = a **variable/column**.
This is your tidy dataset until pandas shows up (Session 8).

---

## Sets: unique, fast membership

```python
answers = ["yes", "no", "yes", "maybe", "no"]
set(answers)            # {'yes', 'no', 'maybe'}  — dedup
"yes" in set(answers)   # True, very fast
```

Great for "distinct responses" and "have I seen this ID?"

---

## Comprehensions

```python
[s["score"] for s in roster]                 # list
[s for s in roster if s["score"] >= 60]      # with filter
{s["name"]: s["score"] for s in roster}      # dict
{s["score"] // 10 for s in roster}           # set of score-decades
```

Read as: *expr, for each item, (optionally) if condition.*

---

## Sorting with a key

```python
sorted(roster, key=lambda s: s["score"])               # ascending
sorted(roster, key=lambda s: s["score"], reverse=True) # descending
```

`lambda s: s["score"]` = "sort by the score field."

---

## TRAP: aliasing (labels, not boxes)

```python
a = [1, 2, 3]
b = a                # SAME list
a.append(4)
b                    # ?  😱  ← predict (see Traps below)

b = a.copy()         # ✅ independent copy
```

`[[0]*3]*3` makes 3 references to ONE row — use `[[0]*3 for _ in range(3)]`.

---

## Your turn

`examples/session-04/practice.md`:
1. Build the roster (list of dicts); sort by score.
2. `{name: score}` dict comprehension.
3. Group students into pass/fail buckets.
4. Demonstrate the aliasing trap and fix it.

---

# Going deeper
## The collections toolkit

---

## Unpacking

```python
name, score = ("Ana", 91)        # tuple unpacking
head, *rest = [10, 20, 30, 40]   # head=10, rest=[20, 30, 40]
a, b = b, a                      # the swap, revisited
for name, score in zip(names, scores): ...   # unpacking IS how zip loops work
```

---

## Dict power methods

```python
student.get("major", "N/A")        # safe lookup with default
student.pop("temp", None)          # remove + return (default if absent)
groups.setdefault("pass", []).append(name)   # create-if-missing, then use
d1 | d2                            # merged dict (right side wins, 3.9+)
for key, val in student.items(): ...
```

---

## `collections.Counter` — frequencies in one line

```python
from collections import Counter
counts = Counter(["yes", "no", "yes", "maybe", "yes"])
counts                 # Counter({'yes': 3, 'no': 1, 'maybe': 1})
counts.most_common(1)  # [('yes', 3)]
```

🧠 Your entire "tally the survey" loop, as one expression. It IS a dict underneath.

---

## `collections.defaultdict` — grouping without ceremony

```python
from collections import defaultdict
by_major = defaultdict(list)          # missing key? make a [] first
for s in roster:
    by_major[s["major"]].append(s["name"])
```

Same job as `setdefault`, cleaner at scale.

---

## Sets, the full toolkit

```python
fall & spring     # intersection: both terms
fall | spring     # union: either
fall - spring     # difference: only fall
fall ^ spring     # symmetric diff: exactly one term
{1, 2} <= {1, 2, 3}   # subset? True
list(dict.fromkeys(xs))   # dedupe KEEPING order (a set won't)
```

---

## Sorting, round 2

```python
sorted(roster, key=lambda s: (-s["score"], s["name"]))
# score high→low, ties broken by name A→Z
```

- Multi-key: return a **tuple** from `key` — compared element by element (Session 2!).
- Python's sort is **stable**: equal keys keep their original order.

---

## `copy` vs `deepcopy`

```python
import copy
flat = a.copy()            # new outer list — inner objects still shared
full = copy.deepcopy(a)    # copies all the way down
```

Rule: nested + you'll mutate the inners → `deepcopy`. Otherwise `.copy()` is enough.

---

## Your turn — round 2

`examples/session-04/practice.md` → **In class — going deeper**:
`Counter` + `defaultdict` re-dos, a multi-key sort, and order-keeping dedupe.
---

## Traps recap

- `=` aliases; use `.copy()` / `copy.deepcopy()`.
- `.sort()` returns None (in place); `sorted()` returns new.
- list ≠ tuple even with same contents (Session 2).
- `dict.get(key, default)` avoids `KeyError`.

## Summary
You can store, look up, dedup, sort, and reshape data.
**Next:** Session 5 — functions, scope & reusability.

---

3. **Fix the grid** — reproduce the `[[0]*3]*3` shared-row bug, then build it right.

# 第 4 课
## 数据结构

---

## 四种容器，四种职责

| 类型 | 语法 | 可变？ | 用途 |
|---|---|---|---|
| `list` | `[1, 2, 3]` | 是 | 有序、会变化的集合 |
| `tuple` | `(1, 2)` | 否 | 固定记录 / 坐标 |
| `dict` | `{"k": v}` | 是 | 键 → 值查找 |
| `set` | `{1, 2, 3}` | 是 | 去重后的唯一元素 |

---

## 列表与切片

```python
xs = [10, 20, 30, 40]
xs[0]      # 10     xs[-1]   # 40（最后一个）
xs[1:3]    # [20, 30]   （不含终点）
xs[:2]     # [10, 20]
xs[::-1]   # 反转
xs.append(50); xs.sort()      # 就地修改
```

⚠️ `xs.sort()` 返回 **None**——它就地排序。想要新列表用 `sorted(xs)`。

---

## 字典 = 带标签的记录

```python
student = {"name": "Ana", "gpa": 3.9}
student["name"]              # "Ana"
student.get("major", "N/A")  # 带默认值的安全访问
student["major"] = "Ed"      # 新增/更新
for key, val in student.items(): ...
```

---

## 字典列表 = 一个数据集 🧠

```python
roster = [
    {"name": "Ana", "score": 91},
    {"name": "Ben", "score": 58},
]
```

每个字典 = 一**行/一名受访者**；每个键 = 一个**变量/一列**。
在 pandas 登场（第 8 课）之前，这就是你的整洁数据集。

---

## 集合：唯一元素、快速成员判断

```python
answers = ["yes", "no", "yes", "maybe", "no"]
set(answers)            # {'yes', 'no', 'maybe'}  —— 去重
"yes" in set(answers)   # True，而且非常快
```

适合"不重复的回答有哪些"和"这个 ID 出现过吗？"

---

## 推导式

```python
[s["score"] for s in roster]                 # 列表
[s for s in roster if s["score"] >= 60]      # 带过滤
{s["name"]: s["score"] for s in roster}      # 字典
{s["score"] // 10 for s in roster}           # 分数段集合
```

读法：*表达式，对每个元素，（可选）如果满足条件。*

---

## 按键排序

```python
sorted(roster, key=lambda s: s["score"])               # 升序
sorted(roster, key=lambda s: s["score"], reverse=True) # 降序
```

`lambda s: s["score"]` = "按 score 字段排序"。

---

## 陷阱：别名（标签，不是盒子）

```python
a = [1, 2, 3]
b = a                # 同一个列表
a.append(4)
b                    # ？ 😱 ← 先预测（见下方陷阱区）

b = a.copy()         # ✅ 独立副本
```

`[[0]*3]*3` 造出的是同一行的 3 个引用——要用 `[[0]*3 for _ in range(3)]`。

# 更进一步
## 容器工具箱

---

## 解包

```python
name, score = ("Ana", 91)        # 元组解包
head, *rest = [10, 20, 30, 40]   # head=10, rest=[20, 30, 40]
a, b = b, a                      # 交换，再看一眼
for name, score in zip(names, scores): ...   # zip 循环的本质就是解包
```

---

## 字典的强力方法

```python
student.get("major", "N/A")        # 带默认值的安全查找
student.pop("temp", None)          # 删除并返回（不存在则给默认值）
groups.setdefault("pass", []).append(name)   # 不存在就先创建，再使用
d1 | d2                            # 合并字典（右边优先，3.9+）
for key, val in student.items(): ...
```

---

## `collections.Counter`——一行搞定频数

```python
from collections import Counter
counts = Counter(["yes", "no", "yes", "maybe", "yes"])
counts                 # Counter({'yes': 3, 'no': 1, 'maybe': 1})
counts.most_common(1)  # [('yes', 3)]
```

🧠 你那整段"统计问卷答案"的循环，浓缩成一个表达式。它本质上就是个字典。

---

## `collections.defaultdict`——分组不费事

```python
from collections import defaultdict
by_major = defaultdict(list)          # 键不存在？先造一个 []
for s in roster:
    by_major[s["major"]].append(s["name"])
```

和 `setdefault` 干同样的活，规模大了更干净。

---

## 集合，完整工具箱

```python
fall & spring     # 交集：两学期都在
fall | spring     # 并集：任一学期在
fall - spring     # 差集：只在秋季
fall ^ spring     # 对称差：恰好只在一个学期
{1, 2} <= {1, 2, 3}   # 子集？True
list(dict.fromkeys(xs))   # 去重且保持顺序（set 做不到）
```

---

## 排序，进阶版

```python
sorted(roster, key=lambda s: (-s["score"], s["name"]))
# 分数从高到低，同分按姓名 A→Z
```

- 多键排序：让 `key` 返回一个**元组**——逐元素比较（第 2 课！）。
- Python 的排序是**稳定的**：键相同的元素保持原有顺序。

---

## `copy` vs `deepcopy`

```python
import copy
flat = a.copy()            # 新的外层列表 —— 内部对象仍然共享
full = copy.deepcopy(a)    # 一路复制到底
```

法则：有嵌套、还要改内层 → `deepcopy`。其余情况 `.copy()` 就够了。

---

- `=` 是别名；要复制用 `.copy()` / `copy.deepcopy()`。

- 内容相同，列表 ≠ 元组（第 2 课）。
- `dict.get(key, default)` 避免 `KeyError`。

<script type="text/markdown" id="quiz-md">
### Quiz — Data Structures
1. Which are mutable: list, tuple, dict, set?
2. `a = [1,2]; b = a; a.append(3)` — what is `b`? Why?
3. (Practical) Write a one-line dict comprehension mapping each name in `names` to `0`.
4. `xs.sort()` vs `sorted(xs)` — what does each return?
5. You need "have I seen this ID before?" over thousands of IDs — which structure, and why?
6. What does `Counter(['a','b','a']).most_common(1)` return?

<details><summary>Show answers</summary>

**Answers:** 1. list, dict, set are mutable; tuple is not. 2. `[1, 2, 3]` — `b` is an
alias for the *same* list (assignment doesn't copy). 3. `{n: 0 for n in names}`.
4. `.sort()` sorts in place and returns `None`; `sorted()` returns a *new* sorted list.
5. A `set` — membership tests are fast and duplicates are impossible by construction. 6. `[('a', 2)]` — a list of (value, count) pairs, biggest first.

</details>
</script>
<script type="text/markdown" id="quiz-zh-md">
### Quiz — 数据结构
1. 哪些是可变的：list、tuple、dict、set？
2. `a = [1,2]; b = a; a.append(3)` —— `b` 是什么？为什么？
3. （实操）一行字典推导式：把 `names` 里的每个名字映射到 `0`。
4. `xs.sort()` vs `sorted(xs)` —— 各返回什么？
5. 要对成千上万个 ID 做"这个 ID 出现过吗？"——选哪种结构，为什么？
6. `Counter(['a','b','a']).most_common(1)` 返回什么？

<details><summary>Show answers</summary>

**答案：** 1. list、dict、set 可变；tuple 不可变。2. `[1, 2, 3]`——`b` 是*同一个*
列表的别名（赋值不复制）。3. `{n: 0 for n in names}`。4. `.sort()` 就地排序、
返回 `None`；`sorted()` 返回*新*的有序列表。5. `set`——成员判断快，且天然不会有
重复。6. `[('a', 2)]`——（值, 次数）对的列表，次数最多的在前。

</details>
