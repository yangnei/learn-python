# Session 2
## The Dynamic-Typing Traps

---

## A name is just a label

Python won't lock a name to a type — it can point at an `int` now and a
`str` later. That freedom is powerful, but it creates **traps** where the
result contradicts your intuition.

> This session is hands-on. Every rule below has a one-line, runnable trap in
> **Traps — predict, then run** at the bottom of the page. Predict first,
> then reveal.

---

## `==` value, `is` identity

- `==` asks "same value?" — almost always what you want.
- `is` asks "same object?" — use it only for `None` (and `True`/`False`).
- `b = a` does **not** copy: both names point at one list, so mutating `a`
  shows through `b`. Copy with `list(a)` or `a[:]`.

🧠 Same GPA = `==`. Same student = `is`.

---

## Booleans are integers

- `bool` is a *subtype* of `int`, so `True` behaves as `1` and `False` as `0`.
- That means `5 + True` works, and `sum(flags)` counts how many are `True`.
- Identity still differs, and `isinstance(True, int)` is true while
  `type(True) is int` is not.

🧠 Dummy coding (1/0) baked right into the language.

---

## Numbers: int, float, division

- `/` **always** returns a float (`4 / 2` is `2.0`); `//` floors **toward −∞**.
- `3 == 3.0` compares by value, but decimals are stored in **binary**, so
  `0.1 + 0.2` is not exactly `0.3`.
- Never test two floats with `==` — use `math.isclose(a, b)`. (You already
  never compare two measured scores for exact equality; same instinct.)

---

## Comparing across types

- `==` / `!=` across types returns `False` and never crashes.
- `<` / `>` across incompatible types raises **TypeError** — the computer can
  ask "same?" but can't *rank* text against numbers.
- A list and a tuple with the same contents are **never equal**; sequences
  compare element by element.

---

## Truthiness

- Falsy: `0  0.0  ""  []  {}  set()  None`. Truthy: everything else —
  including `"0"`, `"False"`, and `[0]`.
- Idiom: `if scores:` rather than `if len(scores) > 0:`.
- But convert user text first — `"0"` is truthy.

---

# Going deeper
## None, conversions & exact decimals

---

## `None`, properly

- `None` means **absence** — "no value here" — not zero, not empty.
- Test with identity: `if x is None:` (never `== None`).
- A function without `return` hands back `None` (you'll meet this again in Session 5).
- Three different "nothings": `None` (missing) · `""` (empty text) · `0` (a real count of zero).
  A survey blank is `None`-shaped; a student with 0 points is not missing.

---

## The conversion matrix

| Call | Result |
|---|---|
| `int("42")` | `42` |
| `int("4.2")` | 💥 `ValueError` |
| `float("4.2")` | `4.2` |
| `int(4.9)` | `4` (truncates) |
| `int(float("4.2"))` | `4` — the two-step |
| `str(4.2)` | `"4.2"` (anything converts *to* str) |

**Rule: convert at the edge, once** — the moment data enters, make it the right type.

---

## `nan` and `inf`

```python
bad = float("nan")     # "not a number" — a failed/missing numeric
bad == bad             # False! NaN equals nothing
import math
math.isnan(bad)        # True — the only reliable test
float("inf") > 10**100 # True — infinity beats everything
```

NaN appears in real data pipelines (pandas uses it for missing cells) — recognize it now.

---

## Mutable vs immutable

| Immutable (can't change) | Mutable (can change) |
|---|---|
| `int, float, bool, str, tuple, None` | `list, dict, set` |

```python
id(x)    # the object's identity — what `is` actually compares
```

Immutables are safe to share; mutables make **aliases** (`b = a` shares!). That's Session 4's
headline trap — you now know *why* it happens.

---

## When floats aren't good enough: `Decimal`

```python
from decimal import Decimal
Decimal("0.1") + Decimal("0.2") == Decimal("0.3")   # True!
```

- Exact decimal arithmetic — build it **from strings**, not floats.
- Use for money and any bookkeeping where `isclose` isn't acceptable.
- Cost: wordier and slower — floats stay the everyday default.
- (`fractions.Fraction` exists too: exact thirds, `Fraction(1, 3)`.)

---

## Chained comparisons, revisited

```python
1 <= likert <= 5        # both ends checked — reads like math
a == b == c             # all three equal
```

But don't chain `is` or mix operators cleverly — chain only when it reads *exactly* like the math
you mean.

## Traps — predict, then reveal
Read each snippet and decide what it does **before** you reveal the answer. To run and tinker with them line by line, open **&#9656; Traps — predict, then run** just below.

<div class="trap">

**1.**

```python
ana_scores = [88, 91]
ben_scores = [88, 91]
ana_scores is ben_scores
```

<details><summary>Reveal the result</summary>

&rarr; `False`

`==` compares VALUES (and `ana_scores == ben_scores` is True); `is` compares IDENTITY — whether they are the same object in memory. Ana's and Ben's lists just happen to match. Use `==` for values and keep `is` for `None`.

</details>

</div>

<div class="trap">

**2.**

```python
roster = ['Ana', 'Ben']
backup = roster
roster.append('Cara')
backup
```

<details><summary>Reveal the result</summary>

&rarr; `['Ana', 'Ben', 'Cara']`

`backup = roster` does not copy: both names point at one list, so appending through `roster` shows up in `backup` too. Copy with `list(roster)` or `roster[:]`.

</details>

</div>

<div class="trap">

**3.**

```python
attended = True
attended == 1
```

<details><summary>Reveal the result</summary>

&rarr; `True`

`bool` is a subclass of `int`: `True == 1` and `False == 0`, which is why a spreadsheet's 1/0 lines up with Python's True/False.

</details>

</div>

<div class="trap">

**4.**

```python
score = 5
bonus = True   # earned a bonus point?
score + bonus
```

<details><summary>Reveal the result</summary>

&rarr; `6`

`True` acts as `1` (and `False` as `0`) in arithmetic — a quick way to add a bonus point for a flag.

</details>

</div>

<div class="trap">

**5.**

```python
passed = [True, False, True, True]   # did each student pass?
sum(passed)
```

<details><summary>Reveal the result</summary>

&rarr; `3`

Summing booleans counts the `True`s — a handy way to count how many students passed.

</details>

</div>

<div class="trap">

**6.**

```python
homework = 0.1
exam = 0.2   # their weights in the final grade
homework + exam
```

<details><summary>Reveal the result</summary>

&rarr; `0.30000000000000004`

Floats are stored in binary, where 0.1 and 0.2 have no exact representation, so the tiny errors add up.

</details>

</div>

<div class="trap">

**7.**

```python
weight = 0.1 + 0.2   # homework + exam
weight == 0.3
```

<details><summary>Reveal the result</summary>

&rarr; `False`

Because `0.1 + 0.2` is `0.30000000000000004`. Never test computed scores with `==`; use `math.isclose(a, b)`.

</details>

</div>

<div class="trap">

**8.**

```python
missing_score = float('nan')
missing_score == missing_score
```

<details><summary>Reveal the result</summary>

&rarr; `False`

`NaN` (a missing/invalid score) is defined to equal nothing, not even itself. Test it with `math.isnan(x)`.

</details>

</div>

<div class="trap">

**9.**

```python
total = 7   # two students' scores added up
total / 2
```

<details><summary>Reveal the result</summary>

&rarr; `3.5`

`/` is always float (true) division, so the mean comes out as `3.5`. Use `//` when you want a whole number.

</details>

</div>

<div class="trap">

**10.**

```python
penalty = -7   # points to spread over 2 assignments
penalty // 2
```

<details><summary>Reveal the result</summary>

&rarr; `-4`

`//` floors toward negative infinity, not toward zero, so `-7 // 2 == -4` (it deducts 4 from each, not 3).

</details>

</div>

<div class="trap">

**11.**

```python
score = '5'   # read from a CSV
score == 5
```

<details><summary>Reveal the result</summary>

&rarr; `False`

Python does no automatic text/number conversion, so a CSV string and a number are simply unequal (no error). Convert first: `int(score) == 5`.

</details>

</div>

<div class="trap">

**12.**

```python
score = '5'
5 > score
```

<details><summary>Reveal the result</summary>

&rarr; `TypeError: '>' not supported between instances of 'int' and 'str'`

Ordering a number against text raises TypeError — there is no sensible order. Convert first: `5 > int(score)`.

</details>

</div>

<div class="trap">

**13.**

```python
scores_list = [88, 91]
scores_tuple = (88, 91)
scores_list == scores_tuple
```

<details><summary>Reveal the result</summary>

&rarr; `False`

A list never equals a tuple, whatever the contents.

</details>

</div>

<div class="trap">

**14.**

```python
passed = True
type(passed) is int
```

<details><summary>Reveal the result</summary>

&rarr; `False`

`type()` is exact, and `passed`'s type is `bool`, not `int`. Use `isinstance` when you want subclass-aware checks.

</details>

</div>

<div class="trap">

**15.**

```python
passed = True
isinstance(passed, int)
```

<details><summary>Reveal the result</summary>

&rarr; `True`

`isinstance` respects subclassing, and `bool` IS a kind of `int`.

</details>

</div>

<div class="trap">

**16.**

```python
answer = '0'   # what a student typed on the survey
bool(answer)
```

<details><summary>Reveal the result</summary>

&rarr; `True`

Any NON-EMPTY string is truthy, including '0' and 'False'. Only the empty string is falsy — so convert survey text before testing it.

</details>

</div>

<div class="trap">

**17.**

```python
submissions = []
bool(submissions)
```

<details><summary>Reveal the result</summary>

&rarr; `False`

Empty containers (`[]`, `{}`, `''`, `0`, `None`) are all falsy, which is why `if submissions:` reads as 'are there any?'.

</details>

</div>

<div class="trap">

**18.**

```python
id_from_csv = int('257')
id_from_form = int('257')   # the same student ID, parsed twice
id_from_csv is id_from_form
```

<details><summary>Reveal the result</summary>

&rarr; `False`

CPython pre-caches small ints (-5..256), so `is` accidentally looks True there; 257 built at runtime are separate objects. Compare values with `==`, never `is`.

</details>

</div>

<script type="text/markdown" id="quiz-md">
### Quiz — The Dynamic-Typing Traps
1. `a = [1,2]; b = [1,2]` — is `a == b`? Is `a is b`? Why?
2. What is `True + True`? Why?
3. Is `0.1 + 0.2 == 0.3` True or False? How *should* you compare them?
4. What does `5 == "5"` give? What about `5 > "5"`?
5. Which of these are falsy: `"0"`, `""`, `[0]`, `[]`, `None`, `0.0`?
6. Why does `Decimal("0.1") + Decimal("0.2") == Decimal("0.3")` hold when the float version doesn't — and why build Decimals from strings?

<details><summary>Show answers</summary>

**Answers:** 1. `==` True (same value), `is` False (different objects in memory).
2. `2` — bool is a subclass of int (`True` acts as `1`). 3. False (binary float rounding);
use `math.isclose(0.1 + 0.2, 0.3)` or round. 4. `False` (no error); `5 > "5"` raises
`TypeError` — Python can't *order* int vs str. 5. `""`, `[]`, `None`, `0.0` are falsy;
`"0"` and `[0]` are truthy (non-empty). 6. `Decimal` stores base-10 digits exactly, so there's no binary rounding; built from a float (`Decimal(0.1)`) it would inherit the float's error.

</details>
