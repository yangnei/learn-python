# Setup & Tools

Everything you need to run Python on your own machine — plus the tools (and AI habits) that make
learning this material faster.

## Fastest start: no install at all
Every example on this site runs **in your browser** — just press **Run**. Nothing to
install, great for the first sessions. When you want to work on *your own files*, install Python
locally with the steps below.

## Run the course as Jupyter notebooks
Every session is also a **Jupyter notebook** — the same examples and practice as a runnable,
cell-by-cell document. Three ways to use them; pick whatever fits:

- **In your browser, no install** — open the live JupyterLite workspace:
  <https://yangnei.github.io/learn-python/jupyter/lab/index.html>. It's real Jupyter running
  entirely in your browser; your edits are saved locally in the browser, nothing is uploaded.
  Each session page also has a **Run in browser** button that opens that session's notebook directly.
- **Google Colab** — each session page has an **Open in Colab** button (free, runs in Google's
  cloud, needs a Google account). Handy when you want to save to Drive or do heavier data work.
- **Local Jupyter** — once Python is installed (below): `pip install jupyterlab`, then run
  `jupyter lab` and open the `.ipynb` you saved with a session page's **Download .ipynb** button.

**How to drive a notebook:** click a cell and press **Shift + Enter** to run it and move to the
next. Predict the output before you run — the surprise is the lesson — then edit a cell and re-run
to experiment.

**Autocomplete & libraries:** press **Tab** to complete a name and **Shift + Tab** to pop up a
function's help. To add a package, run `%pip install <name>` *in a cell* (e.g. `%pip install pandas`).
In the browser (JupyterLite) only Pyodide-compatible packages work — the big ones like `pandas`,
`numpy`, and `matplotlib` do — and the install lasts for the session, so re-run that cell after a
kernel restart. In local Jupyter or Colab, `%pip install` is permanent for that environment.

## Install Python (pick your OS)

**Windows**
- Official installer: <https://www.python.org/downloads/windows/> — on the first screen, **check
  "Add python.exe to PATH"**, then *Install Now*.
- (Alternative) Microsoft Store → search **Python 3.12**.
- Check it worked — open **PowerShell** and run: `python --version`
- Official guide: <https://docs.python.org/3/using/windows.html>

**macOS**
- Official installer: <https://www.python.org/downloads/macos/>
- (Alternative) [Homebrew](https://brew.sh/): `brew install python`
- Check it worked — open **Terminal** and run: `python3 --version`
- Official guide: <https://docs.python.org/3/using/mac.html>

**Linux**
- Usually already installed. If not: `sudo apt install python3 python3-pip` (Debian/Ubuntu) or
  `sudo dnf install python3` (Fedora).
- Check it worked: `python3 --version`
- Official guide: <https://docs.python.org/3/using/unix.html>

**An editor:** install **VS Code** (<https://code.visualstudio.com/>) and its **Python extension**
(by Microsoft). Step-by-step: <https://code.visualstudio.com/docs/python/python-tutorial>.
Prefer something lighter? **Thonny** (<https://thonny.org/>) is a beginner IDE with a built-in
variable viewer and debugger.

**Run a script:** save your code as `name.py`, then in a terminal run `python name.py` (Windows)
or `python3 name.py` (macOS/Linux).

**Install a package** (e.g. for the Session 8 pandas teaser): `pip install pandas` (or `pip3`).

## Visualize what your code does — Python Tutor
**<https://pythontutor.com/>** — paste code and **step through it line by line**, watching
variables, the call stack, and which names point at which objects. It's the single best tool for
the things this course keeps warning you about:
- **aliasing** — see `b = a` make both names point at the *same* list (Session 4),
- the **mutable-default-argument** bug (Session 5),
- the **recursion call stack** building up and unwinding (Session 6).

Whenever you think *"wait, why did that happen?"* — drop the snippet into Python Tutor.

## Use AI to learn (without it doing the work for you)
An AI assistant (Claude, etc.) is a huge accelerator *if you ask it to explain rather than to
write*. Type every solution yourself. Prompts that fit this course:
- **"Summarize this doc page for a beginner, just the 5 things I need: \<paste text or URL\>"** —
  turn a dense reference page into something usable.
- **"Explain this error and its most likely cause, and point me to the line: \<paste the traceback\>"**
- **"Predict what this prints, then explain why: \<code\>"** — then run it and compare. That
  predict-then-run habit *is* the method this course is built on.
- **"Review my function for the traps in this course — identity vs value, aliasing, mutable
  defaults, off-by-one — but don't rewrite it for me."**
- **"Give me 3 harder practice tasks like this one, with the solutions hidden."**

Rule of thumb: **ask it to explain, not to do.** If it hands you code you can't read line by line,
ask it to slow down and walk you through it.

## Other handy tools
- **regex101.com** (<https://regex101.com/>) — build and *explain* regular expressions
  interactively, with a live match view (Session 9). Set the flavor to **Python**.
- **Official docs** — the [Python Tutorial](https://docs.python.org/3/tutorial/) and the
  [Library Reference](https://docs.python.org/3/library/). Bookmark both.
- **Google Colab** (<https://colab.research.google.com/>) — run Python notebooks in the browser,
  no install; a natural next step once you start doing real data work.
- This site's **[Traps & Gotchas](#traps)** sheet — keep it open the whole course.

# Python Traps & Gotchas — The Master Cheat Sheet

> The quirks that bite beginners (and plenty of experts). Every behavior below was run and
> verified on CPython 3.11+. Read the **Surprise** column, cover the **Why/Fix**, and predict.
> Keep this open for the whole course.

---

## 1 — Equality `==` vs Identity `is`  *(Session 2)*

| Expression | Result | |
|---|---|---|
| `a = [1,2]; b = [1,2]; a == b` | `True` | same **value** |
| `a = [1,2]; b = [1,2]; a is b` | `False` | different **objects** in memory |
| `a = [1,2]; b = a; a is b` | `True` | `b` is the *same* object (an alias) |

- **`==`** asks "same value?" — this is what you almost always want.
- **`is`** asks "same object?" — use it **only** for `None`, `True`, `False`:
  ```python
  if x is None:        # ✅ correct
  if x == None:        # ⚠️ works, but not idiomatic — use `is`
  ```
- **Identity wrinkle (do NOT rely on this):** CPython caches small integers (−5 to 256) and
  interns some strings, so `a = 256; b = 256; a is b` is `True` but at `257` it may be `False`.
  This is an implementation detail. **For value, always use `==`.**

🧠 *Bridge:* two students with the same GPA are `==`; the same student is `is`.

---

## 2 — Booleans ARE integers  *(Session 2)*

```python
True == 1            # True   (bool is a subclass of int)
False == 0           # True
5 + True             # 6      yes, you can do arithmetic on bools
sum([True, False, True])   # 2   ← counts the Trues
isinstance(True, int)      # True
type(True) is int          # False  (its type is bool, a subtype)
```
- **Fix / use it well:** `sum(conditions)` is the Pythonic way to *count* how many are true.
- **Trap:** `True is 1` is `False` (different objects) even though `True == 1`. Compare with `==`.

🧠 *Bridge:* this is dummy coding (1/0) built into the language — summing flags counts cases.

---

## 3 — Float precision  *(Session 2)*

```python
0.1 + 0.2            # 0.30000000000000004
0.1 + 0.2 == 0.3     # False  😱
```
- **Why:** decimals are stored in binary; most can't be represented exactly. Not a Python bug — every language does this.
- **Fix:**
  ```python
  import math
  math.isclose(0.1 + 0.2, 0.3)     # True   ← compare floats with a tolerance
  round(0.1 + 0.2, 2) == 0.3       # True   ← or round for display/compare
  from decimal import Decimal       # exact decimal arithmetic when you truly need it (money, grades)
  Decimal("0.1") + Decimal("0.2")  # Decimal('0.3')
  ```
- **Rule:** never test computed floats with `==`. Use `math.isclose` (or `round`).

🧠 *Bridge:* you already never test two measured scores for exact equality — same instinct, new cause (binary storage, not measurement error).

---

## 4 — Comparing across types  *(Session 2)*

```python
5 == "5"     # False   (different types → not equal, but NO error)
5 == 5.0     # True    (int vs float compare by numeric value)
5 > "5"      # 💥 TypeError: '>' not supported between 'int' and 'str'
```
- **Equality (`==`/`!=`)** across unrelated types → just `False`, never crashes.
- **Ordering (`<`,`>`,`<=`,`>=`)** across incompatible types → **`TypeError`**.
- **Fix:** convert first. `int("5") == 5` → `True`. Guard with `isinstance` before ordering.

🧠 *Bridge:* the computer can equate "are these the same?" across types, but can't *rank* text against numbers — it has no shared scale.

---

## 5 — Sequences compare element-by-element  *(Session 2 / 4)*

```python
[1, 2] == [1, 2]     # True
[1, 2] == (1, 2)     # False   ← list vs tuple: different types, never equal
(1, 2) < (1, 3)      # True    ← compares position by position (lexicographic)
"apple" < "banana"   # True    ← strings compare char by char (alphabetical-ish)
[1, 2] < [1, 2, 3]   # True    ← prefix is "less than"
```
- **Trap:** a `list` and a `tuple` with identical contents are **never `==`** — type matters.
- Lists/tuples/strings compare left-to-right; the first differing element decides.

---

## 6 — Truthiness (what counts as False)  *(Session 2 / 3)*

```python
# These are all "falsy":
bool(0) bool(0.0) bool("") bool([]) bool({}) bool(set()) bool(None)   # all False
bool("0")   # True!  ← a non-empty string is truthy, even "0"
bool([0])   # True   ← a non-empty list is truthy, even if it holds a 0
```
- **Fix / idiom:** check emptiness directly — `if scores:` not `if len(scores) > 0:`; `if name:` not `if name != "":`.
- **Trap:** `"0"` (string) and `"False"` (string) are **truthy**. Convert user input before testing.

---

## 7 — `and` / `or` return an operand, not a bool  *(Session 3)*

```python
5 and 0      # 0      (and → first falsy, or last value)
0 or "hi"    # "hi"   (or → first truthy, or last value)
"" or "N/A"  # "N/A"  ← handy default-value idiom
```
- **Use it well:** `name = user_input or "Anonymous"` supplies a default.
- **Trap:** don't write `if x == True`. Just `if x:`. And `and`/`or` short-circuit — the right
  side may never run, so don't hide side effects there.

---

## 8 — Mutable default arguments  *(Session 5)* — the famous one

```python
def add_student(name, roster=[]):     # ❌ DANGER
    roster.append(name)
    return roster

add_student("Ana")     # ['Ana']
add_student("Ben")     # ['Ana', 'Ben']  😱  the default list PERSISTS across calls
```
- **Why:** the default `[]` is created **once**, when the function is *defined*, and reused every call.
- **Fix:**
  ```python
  def add_student(name, roster=None):   # ✅
      if roster is None:
          roster = []
      roster.append(name)
      return roster
  ```
- **Rule:** never use a mutable default (`[]`, `{}`, `set()`). Use `None` and create inside.

---

## 9 — Aliasing: variables are labels, not boxes  *(Session 4)*

```python
a = [1, 2, 3]
b = a            # b is the SAME list, not a copy
a.append(4)
b                # [1, 2, 3, 4]  😱  b changed too

b = a.copy()     # ✅ now b is an independent (shallow) copy
import copy
b = copy.deepcopy(a)   # ✅ independent even for nested lists/dicts
```
- **Trap:** `grid = [[0] * 3] * 3` makes **three references to one row** — editing `grid[0][0]` changes all rows. Use `[[0]*3 for _ in range(3)]`.
- **Rule:** assignment never copies. `=` binds another name to the same object.

🧠 *Bridge:* a variable is a sticky label on an object, not a container holding a value.

---

## 10 — `type()` vs `isinstance()`  *(Session 2)*

```python
isinstance(x, int)              # ✅ Pythonic; respects inheritance
isinstance(x, (int, float))     # ✅ "is x any kind of number?"
type(x) is int                  # exact type only; rarely what you want
type(x) == int                  # works but use `is` for type identity
```
- **Trap:** `isinstance(True, int)` is `True` (bool is a subtype of int). If you must exclude bools,
  check `type(x) is int` or `isinstance(x, int) and not isinstance(x, bool)`.

---

## 11 — Integer vs float division  *(Session 1 / 2)*

```python
7 / 2      # 3.5   true division ALWAYS returns a float
7 // 2     # 3     floor division (rounds toward −∞)
-7 // 2    # -4    ← floors, doesn't truncate toward zero!
7 % 2      # 1     modulo (remainder) — use % 2 to test even/odd
7 / 0      # 💥 ZeroDivisionError
```
- **Trap:** `/` gives a float even when the result is whole (`4 / 2` is `2.0`). Use `//` for integer results.

---

## 12 — Strings are immutable; some methods *return*, don't mutate  *(Session 1 / 9)*

```python
s = "  Hello  "
s.strip()          # "Hello"   ← returns a NEW string
s                  # "  Hello  "  ← s is UNCHANGED
s = s.strip()      # ✅ reassign to keep the result
```
- **Trap:** `s.strip()` / `s.replace(...)` / `s.upper()` do nothing to `s` unless you reassign.
- Contrast: list methods like `.append()`/`.sort()` mutate **in place** and return `None`:
  ```python
  nums = [3, 1, 2]
  nums = nums.sort()    # ❌ now nums is None!  .sort() returns None
  nums.sort()           # ✅ sorts in place; use sorted(nums) to get a new list
  ```

---

## 13 — `range` excludes the stop; off-by-one  *(Session 3)*

```python
list(range(1, 5))      # [1, 2, 3, 4]   ← 5 is NOT included
list(range(5))         # [0, 1, 2, 3, 4]
list(range(0, 10, 2))  # [0, 2, 4, 6, 8]
```
- **Rule:** `range(a, b)` is the half-open interval `[a, b)`.

---

## 14 — Modifying a list while iterating it  *(Session 3)*

```python
xs = [1, 2, 3, 4]
for x in xs:
    if x % 2 == 0:
        xs.remove(x)     # ❌ skips elements / unpredictable
# ✅ iterate a copy, or build a new list:
xs = [x for x in xs if x % 2 != 0]
```

---

## 15 — Files: `"w"` overwrites; cursor exhausts  *(Session 8)*

```python
open("data.csv", "w")    # ❗ TRUNCATES the file to empty immediately
open("data.csv", "a")    # append
open("data.csv", "r")    # read (default)

with open("data.csv") as f:
    rows = f.readlines()      # read once
    again = f.readlines()     # [] — cursor is at end of file now
```
- Always prefer `with open(...) as f:` — it closes the file even if the code crashes.
- With the `csv` module on Windows, open with `newline=""` to avoid blank rows.

---

## 16 — Regex: `.` matches *anything*; use raw strings  *(Session 9)*

```python
import re
re.search(r"\d+", "id 42")     # use r"..." so \d isn't a Python escape
re.search(".", "a.b")          # the "." matches "a", not just the dot!
re.search(r"\.", "a.b")        # use \. for a literal dot
```
- **Rule:** always write patterns as raw strings `r"..."`. Escape `. ^ $ * + ? ( ) [ ] { } | \`.

---

## Quick "predict-then-run" self-test (cover the answers)
```python
print(True + True)            # 2
print(3 == 3.0)               # True
print(0.1 + 0.2 == 0.3)       # False
print(5 == "5")               # False
print([1,2] == (1,2))         # False
print(bool("0"))              # True
print(7 // 2, -7 // 2)        # 3 -4
x = [1]; y = x; x.append(2); print(y)   # [1, 2]
```
If you can explain *why* for all eight, you've got the fundamentals most beginners miss.

# Python Quick Reference — Syntax You'll Forget

> The "how do I write that again?" sheet. Grouped by session.

## I/O & types  *(S1)*
```python
name = input("Name: ")          # ALWAYS returns a str
age  = int(input("Age: "))      # convert immediately
print("Hi", name, age)          # space-separated
print(f"Hi {name}, age {age}")  # f-string (preferred)
print(f"{score:.2f}")           # 2 decimals
print(f"{count:,}")             # thousands separator: 1,234
print("no newline", end="")     # suppress the trailing \n
int("42"), float("3.14"), str(42), bool(0)   # casts
type(x)                          # what type is x?
```

## f-string formatting mini-table
| Spec | Example | Output |
|---|---|---|
| `:.2f` | `f"{3.14159:.2f}"` | `3.14` |
| `:,` | `f"{1234567:,}"` | `1,234,567` |
| `:>8` | `f"{'hi':>8}"` | `      hi` (right-align) |
| `:<8` | `f"{'hi':<8}"` | `hi      ` (left-align) |
| `:^8` | `f"{'hi':^8}"` | `   hi   ` (center) |
| `:.1%` | `f"{0.873:.1%}"` | `87.3%` |

## Conditionals  *(S3)*
```python
if score >= 90:
    grade = "A"
elif score >= 80:
    grade = "B"
else:
    grade = "F"

90 <= score <= 100              # chained comparison
grade = "pass" if score >= 60 else "fail"   # ternary

match command:                   # Python 3.10+
    case "start": ...
    case "stop" | "halt": ...    # multiple values
    case _: ...                  # default
```

## Loops  *(S3)*
```python
for i in range(5): ...                  # 0..4
for x in items: ...                     # each element
for i, x in enumerate(items): ...       # index + element
for a, b in zip(names, scores): ...     # walk two lists together
while condition: ...
while True:                             # validation loop
    x = input("...")
    if valid(x):
        break
# break / continue control flow
```

## Sequences & slicing  *(S4)*
```python
xs = [1, 2, 3]; xs.append(4); xs[0]; xs[-1]   # last
xs[1:3]      # [2, 3]   (start inclusive, stop exclusive)
xs[:2]       # first two
xs[::-1]     # reversed
t = (1, 2)                       # tuple (immutable)
d = {"name": "Ana", "gpa": 3.9}  # dict
d["name"]; d.get("missing", 0)   # access; safe access w/ default
d.keys(); d.values(); d.items()
s = {1, 2, 2, 3}                 # set -> {1, 2, 3}  (unique)
```

## Comprehensions  *(S4/S10)*
```python
[x*2 for x in xs]                       # list
[x for x in xs if x > 0]                # with filter
{name: 0 for name in names}             # dict
{x % 3 for x in xs}                     # set
(x*x for x in xs)                       # generator (lazy)
```

## Sorting  *(S4)*
```python
sorted(xs)                              # new sorted list
sorted(xs, reverse=True)
sorted(students, key=lambda s: s["gpa"])          # by a field
sorted(students, key=lambda s: s["gpa"], reverse=True)
xs.sort()                               # in place (returns None!)
```

## Functions  *(S5)*
```python
def avg(nums: list[float]) -> float:
    """Return the mean of nums."""      # docstring
    return sum(nums) / len(nums)

def greet(name, greeting="Hello"): ...  # default arg (NOT mutable!)
def total(*args): ...                   # any number of positionals -> tuple
def config(**kwargs): ...               # any number of keywords -> dict
func(*my_list)                          # unpack list into args
func(**my_dict)                         # unpack dict into kwargs
```

## Exceptions  *(S7)*
```python
try:
    n = int(value)
except ValueError:
    n = None
except (KeyError, IndexError) as e:
    print(e)
else:
    print("ok")          # ran only if no exception
finally:
    print("always")      # cleanup, always runs

```

## Files & CSV  *(S8)*
```python
with open("f.txt") as f:          # read, auto-closes
    text = f.read()
with open("f.txt", "w") as f:     # write (OVERWRITES)
    f.write("line\n")

import csv
with open("data.csv", newline="") as f:
    for row in csv.DictReader(f):    # row is a dict keyed by header
        print(row["name"])

with open("out.csv", "w", newline="") as f:
    w = csv.DictWriter(f, fieldnames=["name", "gpa"])
    w.writeheader()
    w.writerow({"name": "Ana", "gpa": 3.9})
```

## Regex  *(S9)*
```python
import re
re.search(r"pattern", text)      # first match anywhere (or None)
re.fullmatch(r"\d{5}", zip)      # whole string must match

```
| Token | Means |
|---|---|
| `.` | any char (except newline) |
| `\d \w \s` | digit / word-char / whitespace |
| `+ * ?` | 1+, 0+, 0-or-1 |
| `{m,n}` | between m and n |
| `^ $` | start / end |
| `[...] [^...]` | set / not-in-set |
| `(...)` | capture group |
| `a\|b` | a or b |

## Classes  *(S10)*

class Student:
    def __init__(self, name, gpa):
        self.name = name
        self._gpa = gpa
    def __str__(self):
        return f"{self.name} ({self._gpa})"
    @property
    def gpa(self):
        return self._gpa
    @gpa.setter
    def gpa(self, value):
        if not 0 <= value <= 4:
            raise ValueError("gpa out of range")
        self._gpa = value

s = Student("Ana", 3.9)
print(s)            # uses __str__

# Glossary — Plain-Language Definitions

For a learner who knows research but not code. Each term: what it is, in one breath.

- **Argument** — a value you hand to a function when you call it. `int("5")` — `"5"` is the argument.
- **Parameter** — the named slot in a function definition that receives an argument. `def f(x):` — `x` is the parameter.
- **Variable** — a *name* (label) pointing at an object. Not a box; a sticky note.
- **Object** — any value Python stores: a number, string, list, function, even a type. "Everything is an object."
- **Type** — the kind of an object: `int`, `float`, `str`, `bool`, `list`, `dict`, `set`, `tuple`, `NoneType`.
- **Dynamic typing** — variables aren't locked to one type; the *object* has a type, the *name* doesn't.
- **`int` / `float`** — whole number / decimal number. `/` always makes a float; `//` floors to int.
- **`str`** — text. Immutable (can't change in place). Written in quotes.
- **`bool`** — `True`/`False`. Technically a kind of `int` (`True == 1`).
- **`None`** — "no value." Returned by functions that don't `return` anything. Test with `is None`.
- **f-string** — `f"...{expr}..."` — a string with `{}` placeholders filled by Python.
- **Equality (`==`)** — "same value?" The comparison you usually want.
- **Identity (`is`)** — "literally the same object in memory?" Use only for `None`/`True`/`False`.
- **Truthy / Falsy** — any value used in an `if` counts as true unless it's `0`, `""`, `[]`, `{}`, `set()`, or `None`.
- **Mutable / Immutable** — can it be changed in place? `list`/`dict`/`set` yes; `int`/`str`/`tuple` no.
- **Aliasing** — two names pointing at the *same* mutable object; changing one shows in the other.
- **Slicing** — taking a sub-sequence: `xs[start:stop:step]`, stop excluded.
- **Comprehension** — a one-line way to build a list/dict/set from a loop: `[x*2 for x in xs]`.
- **Function** — a reusable named block of code; takes inputs, optionally `return`s an output.
- **`return` vs `print`** — `return` hands a value back to the *caller*; `print` just shows text to the screen.
- **Scope** — where a name is visible. Python looks Local → Enclosing → Global → Built-in (LEGB).
- **`*args` / `**kwargs`** — collect "any number of" positional args (as a tuple) / keyword args (as a dict).
- **Type hint** — optional annotation of expected types (`def f(x: int) -> str:`). Documentation, **not** enforced at runtime.
- **Exception** — an error raised at runtime (e.g., `ValueError`). Handle with `try`/`except`.
- **`raise`** — deliberately throw an exception. **EAFP** — "easier to ask forgiveness than permission": try it, catch failure.
- **`assert`** — a developer sanity-check that errors if false. Not for validating user input (can be turned off).
- **Module** — a `.py` file you can `import`. **Library / package** — a bundle of modules (install via `pip`).
- **Standard library** — modules that ship with Python (`csv`, `statistics`, `random`, `re`, `json`, `datetime`, `pathlib`).
- **Context manager (`with`)** — a block that sets up and tears down a resource automatically (e.g., closes a file).
- **CSV** — comma-separated values; a plain-text table. `csv.DictReader` turns each row into a dict.
- **Class / Object (OOP)** — a blueprint (`class`) and the things built from it (instances). Bundles data + behavior.
- **`self`** — inside a class, "this particular instance."
- **`__init__`** — the setup method run when you create an instance. **Dunder** = "double underscore" method.
- **`@property`** — makes a method look like an attribute; lets you validate on get/set.
- **Generator / `yield`** — produces values one at a time, lazily; saves memory on big data. Can be iterated once.
- **`lambda`** — a tiny anonymous function, often used as a `key=` for sorting.
- **Regex (regular expression)** — a pattern language for matching/extracting text (`re` module).
- **Traceback** — the error report Python prints when something fails. **Read the last line first.**
- **REPL** — the interactive `>>>` prompt where you type one line at a time.

# Python 陷阱与坑 —— 主速查表

> 咬新手（也咬不少老手）的语言怪癖。以下每个行为都在 CPython 3.11+ 上实际运行并
> 验证过。看**惊讶**一栏、盖住**原因/修法**，先预测。
> 整门课程都把它开着。

---

## 1 — 相等 `==` vs 同一 `is`  *(第 2 课)*

| 表达式 | 结果 | |
|---|---|---|
| `a = [1,2]; b = [1,2]; a == b` | `True` | **值**相同 |
| `a = [1,2]; b = [1,2]; a is b` | `False` | 内存中是不同的**对象** |
| `a = [1,2]; b = a; a is b` | `True` | `b` 是*同一个*对象（别名） |

- **`==`** 问"值相同吗？"——几乎永远是你想要的。
- **`is`** 问"是同一个对象吗？"——**只**用于 `None`、`True`、`False`：
  ```python
  if x is None:        # ✅ 正确
  if x == None:        # ⚠️ 能跑，但不地道 —— 用 `is`
  ```
- **身份的小怪癖（千万别依赖）：** CPython 缓存小整数（−5 到 256）并驻留部分字符串，
  所以 `a = 256; b = 256; a is b` 为 `True`，到 `257` 就可能是 `False`。
  这是实现细节。**比值，永远用 `==`。**

🧠 *桥接：* GPA 相同的两名学生是 `==`；同一名学生才是 `is`。

---

## 2 — 布尔值就是整数  *(第 2 课)*

```python
True == 1            # True   （bool 是 int 的子类）
False == 0           # True
5 + True             # 6      对，布尔值能做算术
sum([True, False, True])   # 2   ← 数出 True 的个数
isinstance(True, int)      # True
type(True) is int          # False  （它的类型是 bool，一个子类型）
```
- **善用它：** `sum(conditions)` 是数"多少个为真"的 Python 惯用法。
- **陷阱：** 尽管 `True == 1`，`True is 1` 却是 `False`（不同对象）。用 `==` 比较。

🧠 *桥接：* 这就是语言内置的哑变量编码（1/0）——对标志求和就是在数个案。

---

## 3 — 浮点精度  *(第 2 课)*

```python
0.1 + 0.2            # 0.30000000000000004
0.1 + 0.2 == 0.3     # False  😱
```
- **原因：** 小数以二进制存储；大多数小数无法精确表示。不是 Python 的 bug——每门语言都这样。
- **修法：**
  ```python
  import math
  math.isclose(0.1 + 0.2, 0.3)     # True   ← 用容差比较浮点数
  round(0.1 + 0.2, 2) == 0.3       # True   ← 或者取整后展示/比较
  from decimal import Decimal       # 真正需要时用精确十进制（金钱、成绩）
  Decimal("0.1") + Decimal("0.2")  # Decimal('0.3')
  ```
- **法则：** 永远不要用 `==` 检验计算出的浮点数。用 `math.isclose`（或 `round`）。

🧠 *桥接：* 你本来就从不对两个测量分数做精确相等判断——直觉相同，原因换了
（二进制存储，不是测量误差）。

---

## 4 — 跨类型比较  *(第 2 课)*

```python
5 == "5"     # False   （类型不同 → 不相等，但不报错）
5 == 5.0     # True    （int 与 float 按数值比较）
5 > "5"      # 💥 TypeError: '>' not supported between 'int' and 'str'
```
- 不相干类型之间的**相等（`==`/`!=`）** → 直接 `False`，从不崩溃。
- 不兼容类型之间的**排序（`<`、`>`、`<=`、`>=`）** → **`TypeError`**。
- **修法：** 先转换。`int("5") == 5` → `True`。排序前用 `isinstance` 把关。

🧠 *桥接：* 计算机能跨类型回答"是不是一样？"，却无法给文本和数字*排名*——它们没有共同量尺。

---

## 5 — 序列逐元素比较  *(第 2 / 4 课)*

```python
[1, 2] == [1, 2]     # True
[1, 2] == (1, 2)     # False   ← 列表 vs 元组：类型不同，永不相等
(1, 2) < (1, 3)      # True    ← 逐位置比较（字典序）
"apple" < "banana"   # True    ← 字符串逐字符比较（近似字母序）
[1, 2] < [1, 2, 3]   # True    ← 前缀算"小于"
```
- **陷阱：** 内容完全相同的 `list` 和 `tuple` **永远不 `==`**——类型有一票否决权。
- 列表/元组/字符串从左到右比较；第一个不同的元素定胜负。

---

## 6 — 真值判断（什么算 False）  *(第 2 / 3 课)*

```python
# 这些都是"假值"：
bool(0) bool(0.0) bool("") bool([]) bool({}) bool(set()) bool(None)   # 全是 False
bool("0")   # True！ ← 非空字符串是真值，"0" 也不例外
bool([0])   # True   ← 非空列表是真值，哪怕装的是个 0
```
- **惯用法：** 直接判断"空不空"——`if scores:` 而不是 `if len(scores) > 0:`；
  `if name:` 而不是 `if name != "":`。
- **陷阱：** 字符串 `"0"` 和 `"False"` 都是**真值**。用户输入先转换再判断。

---

## 7 — `and` / `or` 返回操作数，不是布尔值  *(第 3 课)*

```python
5 and 0      # 0      （and → 第一个假值，否则最后一个值）
0 or "hi"    # "hi"   （or → 第一个真值，否则最后一个值）
"" or "N/A"  # "N/A"  ← 顺手的默认值惯用法
```
- **善用它：** `name = user_input or "Anonymous"` 提供默认值。
- **陷阱：** 别写 `if x == True`，直接 `if x:`。另外 `and`/`or` 短路——右侧可能
  根本不运行，别把副作用藏在那里。

---

## 8 — 可变默认参数  *(第 5 课)* —— 大名鼎鼎的那个

```python
def add_student(name, roster=[]):     # ❌ 危险
    roster.append(name)
    return roster

add_student("Ana")     # ['Ana']
add_student("Ben")     # ['Ana', 'Ben']  😱  默认列表跨调用一直存在
```
- **原因：** 默认的 `[]` 只在函数*定义*时创建**一次**，之后每次调用都复用它。
- **修法：**
  ```python
  def add_student(name, roster=None):   # ✅
      if roster is None:
          roster = []
      roster.append(name)
      return roster
  ```
- **法则：** 永远不要用可变默认值（`[]`、`{}`、`set()`）。用 `None`，在函数体内创建。

---

## 9 — 别名：变量是标签，不是盒子  *(第 4 课)*

```python
a = [1, 2, 3]
b = a            # b 是同一个列表，不是副本
a.append(4)
b                # [1, 2, 3, 4]  😱  b 也变了

b = a.copy()     # ✅ 现在 b 是独立的（浅）副本
import copy
b = copy.deepcopy(a)   # ✅ 连嵌套的列表/字典也独立
```
- **陷阱：** `grid = [[0] * 3] * 3` 造出**同一行的三个引用**——改 `grid[0][0]` 三行全变。
  要用 `[[0]*3 for _ in range(3)]`。
- **法则：** 赋值从不复制。`=` 只是给同一个对象再绑一个名字。

🧠 *桥接：* 变量是贴在对象上的便利贴，不是装着值的容器。

---

## 10 — `type()` vs `isinstance()`  *(第 2 课)*

```python
isinstance(x, int)              # ✅ 地道；尊重继承
isinstance(x, (int, float))     # ✅ "x 是某种数字吗？"
type(x) is int                  # 只认精确类型；很少是你要的
type(x) == int                  # 能跑，但类型身份请用 `is`
```
- **陷阱：** `isinstance(True, int)` 为 `True`（bool 是 int 的子类型）。必须排除布尔时，
  用 `type(x) is int` 或 `isinstance(x, int) and not isinstance(x, bool)`。

---

## 11 — 整数除法 vs 浮点除法  *(第 1 / 2 课)*

```python
7 / 2      # 3.5   真除法永远返回浮点数
7 // 2     # 3     整除（向 −∞ 取整）
-7 // 2    # -4    ← 是向下取整，不是向零截断！
7 % 2      # 1     取余 —— 用 % 2 判断奇偶
7 / 0      # 💥 ZeroDivisionError
```
- **陷阱：** `/` 即使结果是整数也给浮点数（`4 / 2` 是 `2.0`）。要整数结果用 `//`。

---

## 12 — 字符串不可变；有些方法*返回*而不*修改*  *(第 1 / 9 课)*

```python
s = "  Hello  "
s.strip()          # "Hello"   ← 返回一个新字符串
s                  # "  Hello  "  ← s 原封不动
s = s.strip()      # ✅ 想留住结果就赋回去
```
- **陷阱：** `s.strip()` / `s.replace(...)` / `s.upper()` 对 `s` 毫无作用，除非重新赋值。
- 对比：列表方法如 `.append()`/`.sort()` **就地**修改并返回 `None`：
  ```python
  nums = [3, 1, 2]
  nums = nums.sort()    # ❌ nums 现在是 None！ .sort() 返回 None

# 术语表 —— 大白话释义

写给懂研究、不懂代码的学习者。每个词条：一口气说清它是什么。

- **实参（Argument）** —— 调用函数时递进去的值。`int("5")` 里的 `"5"` 就是实参。
- **形参（Parameter）** —— 函数定义里接收实参的命名占位。`def f(x):` 里的 `x` 就是形参。
- **变量（Variable）** —— 指向对象的一个*名字*（标签）。不是盒子；是便利贴。
- **对象（Object）** —— Python 存储的任何值：数字、字符串、列表、函数，甚至类型。"万物皆对象。"
- **类型（Type）** —— 对象的种类：`int`、`float`、`str`、`bool`、`list`、`dict`、`set`、`tuple`、`NoneType`。
- **动态类型（Dynamic typing）** —— 变量不锁定类型；有类型的是*对象*，不是*名字*。
- **`int` / `float`** —— 整数 / 小数。`/` 永远得到浮点数；`//` 向下取整成整数。
- **`str`** —— 文本。不可变（不能就地修改）。写在引号里。
- **`bool`** —— `True`/`False`。技术上是一种 `int`（`True == 1`）。
- **`None`** —— "没有值"。不 `return` 的函数返回的就是它。用 `is None` 检测。
- **f-string** —— `f"...{expr}..."` —— 带 `{}` 占位符、由 Python 填空的字符串。
- **相等（`==`）** —— "值相同吗？"你通常想要的比较。
- **同一（`is`）** —— "是内存里同一个对象吗？"只用于 `None`/`True`/`False`。
- **真值 / 假值（Truthy / Falsy）** —— 放进 `if` 的值都算真，除非是 `0`、`""`、`[]`、`{}`、`set()` 或 `None`。
- **可变 / 不可变（Mutable / Immutable）** —— 能否就地修改？`list`/`dict`/`set` 能；`int`/`str`/`tuple` 不能。
- **别名（Aliasing）** —— 两个名字指向*同一个*可变对象；改一个，另一个也变。
- **切片（Slicing）** —— 取子序列：`xs[start:stop:step]`，不含终点。
- **推导式（Comprehension）** —— 用一行循环构建列表/字典/集合：`[x*2 for x in xs]`。
- **函数（Function）** —— 可复用的具名代码块；接收输入，可选地 `return` 输出。
- **`return` vs `print`** —— `return` 把值交回*调用者*；`print` 只是往屏幕上显示文字。
- **作用域（Scope）** —— 名字在哪里可见。Python 按 局部 → 闭包 → 全局 → 内置（LEGB）查找。
- **`*args` / `**kwargs`** —— 收集"任意个"位置参数（元组）/ 关键字参数（字典）。
- **类型标注（Type hint）** —— 对期望类型的可选注释（`def f(x: int) -> str:`）。是文档，运行时**不**强制。
- **异常（Exception）** —— 运行时抛出的错误（如 `ValueError`）。用 `try`/`except` 处理。
- **`raise`** —— 主动抛出异常。**EAFP** —— "先斩后奏"：直接试，失败再接住。
- **`assert`** —— 开发者的自检，不成立就报错。不能用来校验用户输入（可以被关闭）。
- **模块（Module）** —— 可以 `import` 的 `.py` 文件。**库 / 包** —— 一捆模块（用 `pip` 安装）。
- **标准库（Standard library）** —— Python 自带的模块（`csv`、`statistics`、`random`、`re`、`json`、`datetime`、`pathlib`）。
- **上下文管理器（`with`）** —— 自动搭建并拆除资源的代码块（比如自动关文件）。
- **CSV** —— 逗号分隔值；纯文本表格。`csv.DictReader` 把每行变成字典。
- **类 / 对象（OOP）** —— 蓝图（`class`）和照它造出来的东西（实例）。把数据和行为捆在一起。
- **`self`** —— 在类内部，指"眼下这一个实例"。
- **`__init__`** —— 创建实例时运行的初始化方法。**Dunder** = "双下划线"方法。
- **`@property`** —— 让方法看起来像属性；可以在读/写时做校验。
- **生成器 / `yield`** —— 惰性地一次产出一个值；大数据省内存。只能遍历一次。
- **`lambda`** —— 极小的匿名函数，常用作排序的 `key=`。
- **正则表达式（Regex）** —— 匹配/提取文本的模式语言（`re` 模块）。
- **回溯（Traceback）** —— 出错时 Python 打印的报告。**先读最后一行。**
- **REPL** —— 交互式 `>>>` 提示符，一次输入一行。
