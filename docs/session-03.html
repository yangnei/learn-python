# Session 3
## Control Flow: Conditionals & Loops

---

## Part 1 — Conditionals

```python
if score >= 90:
    grade = "A"
elif score >= 80:
    grade = "B"
else:
    grade = "F"
```

Indentation defines the block. Only the **first** true branch runs.

---

## `if` vs `elif` — not interchangeable

```python
# BUG: three separate ifs — a 95 prints ALL THREE labels
if score >= 60: print("passing")
if score >= 80: print("strong")
if score >= 90: print("excellent")
```

- Stacked `if`s are **independent questions** — overlapping conditions all fire.
- `elif` makes them **one question with branches**: first hit wins, the rest are skipped.
- Stack `if`s only when several can *legitimately* be true at once.

---

## Comparison + chained comparisons

`==`  `!=`  `<`  `<=`  `>`  `>=`

```python
0 <= score <= 100      # chained — reads like math
```

🧠 No need for `score >= 0 and score <= 100` — chain it.

---

## Logical operators (and the gotcha)

```python
passed and submitted     # both
late or excused          # either
not flagged              # negate
```

**Short-circuit:** `a and b` skips `b` if `a` is falsy.
And `and`/`or` return an **operand, not a bool**:

```python
5 and 0        # ?  ← predict, then reveal in Traps below
"" or "N/A"    # the default-value idiom
```

So write `if x:` — never `if x == True`.

---

## Part 2 — Loops

```python
for s in scores:          # each element directly
    print(s)

for i in range(5):        # 0,1,2,3,4
    print(i)

while not done:           # repeat until a condition flips
    ...
```

⚠️ `range(1, 5)` → `1,2,3,4` — **stop is excluded** (off-by-one!).
`for _ in range(3):` — `_` is the convention for "just repeat; I don't use the value."

---

## break / continue

```python
for x in data:
    if x is None:
        continue          # skip this one
    if x == "STOP":
        break             # leave the loop entirely
    process(x)
```

---

## Stop juggling indices: enumerate & zip

```python
for i, name in enumerate(names):       # index + value
    print(i, name)

for name, score in zip(names, scores): # two lists together
    print(name, score)
```

🧠 If you write `range(len(x))`, stop — use `enumerate`/`zip`.

---

## The validation loop (you'll reuse this everywhere)

```python
while True:
    raw = input("Score 0–100: ")
    if raw.isdigit() and 0 <= int(raw) <= 100:
        score = int(raw)
        break
    print("Try again.")
```

---

## Your turn

`examples/session-03/practice.md`:
1. Grade-band classifier — test the boundaries (89.999 / 90 / 90.001).
2. Average a roster and label each student PASS/FAIL with `zip`.
3. A robust "ask until valid" loop.
4. The double-label bug — three stacked `if`s that should be one ladder.

---

# Going deeper
## More control flow

---

## The ternary — a tiny `if` in one line

```python
label = "pass" if score >= 60 else "fail"
print(f"{name}: {'✔' if attended else '✘'}")
```

For **tiny** choices only. If it needs two reads, use a real `if`.

---

## Return the test itself

```python
def is_passing(score):        # clunky
    if score >= 60:
        return True
    return False

def is_passing(score):        # Pythonic — the comparison already IS a bool
    return score >= 60
```

Then use it bare: `if is_passing(s):` — never `if is_passing(s) == True:`.
🧠 Same for any yes/no helper: `is_valid`, `is_missing`, `is_full` — one `return` line each.

---

## `match/case` — the readable ladder (3.10+)

```python
match answer:
    case 5 | 4:
        label = "agree"
    case 3:
        label = "neutral"
    case 1 | 2:
        label = "disagree"
    case _:                 # the default
        label = "invalid"
```

When every branch compares the **same value** against literals, `match` beats an `elif` ladder.

---

## `for/else` — search without a flag

```python
for s in scores:
    if s < 60:
        print("first failing score:", s)
        break
else:                      # runs only if the loop did NOT break
    print("everyone passed")
```

The `else` belongs to the `for`. No `found = False` bookkeeping needed.

---

## Nested loops

```python
for section in ["A", "B"]:
    for student in roster:
        print(section, student)
```

- Every inner pass runs per outer pass (2 × 4 = 8 lines).
- `break` exits the **inner** loop only — to escape both, put the loops in a function and `return`.

---

## Name the pattern you're writing

| Pattern | Skeleton |
|---|---|
| **accumulator** | `total = 0` … `total += x` |
| **counter** | `n = 0` … `n += 1` |
| **best-so-far** | `best = xs[0]` … `if x > best: best = x` |
| **sentinel** | `while True:` … `if raw == "done": break` |

Recognizing these turns "staring at a blank editor" into "picking a skeleton".

---

## Your turn — round 2

`examples/session-03/practice.md` → **In class — going deeper**:
a `match/case` rewrite, a `for/else` search, best-so-far without `max()`, and the
return-the-test rewrite.
---

## Traps recap

- `if x == True` → just `if x:`; use `x is None` (not `== None`).
- Stacked `if`s are independent questions — they ALL fire; `elif` makes one ladder.
- `=` (assign) vs `==` (compare) — classic typo.
- `range(1, 5)` excludes 5; test your boundaries.
- Don't modify a list while looping it; prefer `enumerate`/`zip` over `range(len(...))`.

*(More in the cheat sheet: `match`/`case`, the ternary, `for/else`.)*

## Summary
You can branch and repeat cleanly.

# 第 3 课
## 控制流：条件与循环

---

## 第一部分——条件语句

```python
if score >= 90:
    grade = "A"
elif score >= 80:
    grade = "B"
else:
    grade = "F"
```

缩进划定代码块。只有**第一个**为真的分支会执行。

---

## `if` 与 `elif`——不可互换

```python
# BUG：三个独立的 if —— 95 分会把三个标签全打出来
if score >= 60: print("passing")
if score >= 80: print("strong")
if score >= 90: print("excellent")
```

- 并排的 `if` 是**互相独立的问题**——条件重叠时会全部触发。
- `elif` 把它们变成**一个带分支的问题**：第一个命中即止，其余跳过。
- 只有当多个条件*确实*可以同时成立时，才用并排的 `if`。

---

## 比较运算 + 链式比较

`==`  `!=`  `<`  `<=`  `>`  `>=`

```python
0 <= score <= 100      # 链式 —— 读起来像数学
```

🧠 不必写 `score >= 0 and score <= 100`——链起来。

---

## 逻辑运算符（附一个坑）

```python
passed and submitted     # 两者都
late or excused          # 任一
not flagged              # 取反
```

**短路求值：** `a and b` 在 `a` 为假时直接跳过 `b`。
而且 `and`/`or` 返回的是**操作数，不是布尔值**：

```python
5 and 0        # ？ ← 先预测，再到下方陷阱区揭晓
"" or "N/A"    # 默认值惯用法
```

所以写 `if x:`——永远不要写 `if x == True`。

---

## 第二部分——循环

```python
for s in scores:          # 直接遍历每个元素
    print(s)

for i in range(5):        # 0,1,2,3,4
    print(i)

while not done:           # 条件翻转前一直重复
    ...
```

⚠️ `range(1, 5)` → `1,2,3,4` —— **不含终点**（差一错误！）。
`for _ in range(3):` —— `_` 是"只管重复、不用这个值"的约定写法。

---

## break / continue

```python
for x in data:
    if x is None:
        continue          # 跳过这一个
    if x == "STOP":
        break             # 彻底离开循环
    process(x)
```

---

## 别再摆弄下标：enumerate 与 zip

```python
for i, name in enumerate(names):       # 序号 + 值
    print(i, name)

for name, score in zip(names, scores): # 两个列表并排走
    print(name, score)
```

🧠 一旦写出 `range(len(x))`，停下——改用 `enumerate`/`zip`。

---

## 输入校验循环（以后到处都用得上）

```python
while True:
    raw = input("Score 0–100: ")
    if raw.isdigit() and 0 <= int(raw) <= 100:
        score = int(raw)
        break
    print("Try again.")
```

# 更进一步
## 更多控制流

---

## 三元表达式——一行版的小 `if`

```python
label = "pass" if score >= 60 else "fail"
print(f"{name}: {'✔' if attended else '✘'}")
```

只用于**微小**的选择。要读两遍才懂的，就写成真正的 `if`。

---

## 把判断本身返回出去

```python
def is_passing(score):        # 笨拙
    if score >= 60:
        return True
    return False

def is_passing(score):        # Pythonic —— 比较结果本来就是 bool
    return score >= 60
```

然后直接裸用：`if is_passing(s):`——永远不要写 `if is_passing(s) == True:`。
🧠 一切"是/否"辅助函数都一样：`is_valid`、`is_missing`、`is_full`——每个一行 `return`。

---

## `match/case`——更好读的梯子（3.10+）

```python
match answer:
    case 5 | 4:
        label = "agree"
    case 3:
        label = "neutral"
    case 1 | 2:
        label = "disagree"
    case _:                 # 默认分支
        label = "invalid"
```

当每个分支都在拿**同一个值**对比字面量时，`match` 比 `elif` 梯子好读。

---

## `for/else`——不用旗标变量的查找

```python
for s in scores:
    if s < 60:
        print("first failing score:", s)
        break
else:                      # 只在循环没有 break 时运行
    print("everyone passed")
```

这个 `else` 属于 `for`。不需要 `found = False` 那套记账。

---

## 嵌套循环

```python
for section in ["A", "B"]:
    for student in roster:
        print(section, student)
```

- 外层每走一步，内层完整跑一遍（2 × 4 = 8 行输出）。
- `break` 只跳出**内层**——想两层都跳，就把循环放进函数里 `return`。

---

## 给你正在写的模式起个名字

| 模式 | 骨架 |
|---|---|
| **累加器** | `total = 0` … `total += x` |
| **计数器** | `n = 0` … `n += 1` |
| **迄今最优** | `best = xs[0]` … `if x > best: best = x` |
| **哨兵** | `while True:` … `if raw == "done": break` |

认得这些模式，"对着空编辑器发呆"就变成了"挑一副骨架"。

---

## 轮到你了——第二轮

`examples/session-03/practice.md` → **In class — going deeper**：
`match/case` 重写、`for/else` 查找、不用 `max()` 的迄今最优，以及
"把判断返回出去"的重写。

---

## 陷阱回顾

- `if x == True` → 直接 `if x:`；判断 None 用 `x is None`（不是 `== None`）。
- 并排的 `if` 是独立问题——会全部触发；`elif` 才是一架梯子。
- `=`（赋值）vs `==`（比较）——经典手滑。
- `range(1, 5)` 不含 5；测试你的边界值。
- 不要边遍历边修改列表；用 `enumerate`/`zip` 替代 `range(len(...))`。

*（速查表里还有：`match`/`case`、三元表达式、`for/else`。）*

## 小结
你已经能干净利落地分支与循环。

&rarr; `False`

`all()` 只有在**每个**元素都通过时才为 True；55 不及格，所以是 False。

<script type="text/markdown" id="quiz-md">
### Quiz — Control Flow: Conditionals & Loops
1. Rewrite `if x >= 90 and x < 100:` using a chained comparison.
2. What is `5 and 0`? What is `0 or "hi"`? Why aren't they `True`/`False`?
3. What does `list(range(1, 5))` produce?
4. What goes wrong when you `remove` items from a list while looping over it — and what's
   the fix?
5. When does the `else` clause on a `for` loop run?
6. With `score = 95`, three stacked `if score >= 60 / 80 / 90:` prints run — what happens, and what one keyword fixes it?

<details><summary>Show answers</summary>

**Answers:** 1. `if 90 <= x < 100:`. 2. `0` and `"hi"` — `and`/`or` return an *operand*,
not a bool. 3. `[1, 2, 3, 4]` (5 excluded — off-by-one). 4. Removal shifts the remaining
indices, so elements get skipped; build a new list instead
(`[x for x in xs if keep(x)]`) or iterate over a copy. 5. Only when the loop finishes **without** `break` — the "searched everything, found nothing" branch. 6. All three labels print (each `if` is an independent question); chaining with `elif` makes one ladder where only the first hit runs.

</details>
</script>
<script type="text/markdown" id="quiz-zh-md">
### Quiz — 控制流：条件与循环
1. 用链式比较重写 `if x >= 90 and x < 100:`。
2. `5 and 0` 是什么？`0 or "hi"` 是什么？为什么它们不是 `True`/`False`？
3. `list(range(1, 5))` 产生什么？
4. 一边遍历列表一边 `remove` 元素会出什么问题——怎么修？
5. `for` 循环的 `else` 子句什么时候运行？
6. `score = 95` 时，三个并排的 `if score >= 60 / 80 / 90:` 打印会发生什么——哪个关键字能修好它？

<details><summary>Show answers</summary>

**答案：** 1. `if 90 <= x < 100:`。2. `0` 和 `"hi"`——`and`/`or` 返回的是*操作数*，
不是布尔值。3. `[1, 2, 3, 4]`（不含 5——差一错误）。4. 删除使后续下标前移，
元素被跳过；改为构建新列表（`[x for x in xs if keep(x)]`）或遍历副本。
5. 仅当循环**没有** `break` 时——"找遍了也没找到"的分支。6. 三个标签全部打印
（每个 `if` 都是独立问题）；用 `elif` 串成一架梯子，只有第一个命中的分支运行。

</details>
