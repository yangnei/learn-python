# Session 6
## Recursion & Recursive Thinking

---

## The shape of every recursion

Real example: how many prerequisites deep is a course?

```python
prereq_of = {"ED700": "ED600", "ED600": "ED500",
             "ED500": "ED400", "ED400": None}   # ED400 has none

def prereqs_deep(course):
    earlier = prereq_of[course]
    if earlier is None:               # BASE CASE — stop here
        return 0
    return 1 + prereqs_deep(earlier)  # RECURSIVE CASE — step back one
```

Two parts, always:
- a **base case** that stops, and
- a **recursive case** that moves *toward* the base case.

---

## Trace the call stack

`orderings(n)` = ways to rank *n* students = n!

```python
orderings(3)
= 3 * orderings(2)
=     3 * (2 * orderings(1))
=         3 * (2 * 1)          # base case returns 1
= 6
```

Each call waits on the one inside it. The calls stack up, then unwind.

🧠 Each pending call is a **stack frame** — that matters in a moment.

---

## Recursion vs iteration

```python
def orderings(n):                 # ways to rank n students (n!)
    if n <= 1:
        return 1
    return n * orderings(n - 1)   # ← must RETURN the call

def orderings_loop(n):
    total = 1
    for k in range(2, n + 1):
        total *= k
    return total
```

Same answer. For flat counting, the **loop** is usually clearer.

---

## Where recursion shines: nested data

```python
def deep_sum(obj):
    if isinstance(obj, (int, float)):
        return obj
    if isinstance(obj, dict):
        return sum(deep_sum(v) for v in obj.values())
    if isinstance(obj, (list, tuple)):
        return sum(deep_sum(x) for x in obj)
    return 0

deep_sum([1, [2, [3, 4]], {"a": 6}])   # 16
```

Nested JSON, folder trees, threaded replies — a single loop can't reach all the way down. Recursion can.

---

## The trap: no base case

```python
def runaway(n):
    return runaway(n + 1)     # never stops
```

```
RecursionError: maximum recursion depth exceeded
```

Python has **no tail-call optimization** — every call keeps its frame
(default limit ≈ 1000). Deep recursion *will* hit the ceiling.

---

# Going deeper
## Recursion in the wild

---

## Memoization: remember past calls

```python
def fib(n):                       # naive: fib(35) recomputes fib(5) thousands of times
    return n if n < 2 else fib(n - 1) + fib(n - 2)

import functools
@functools.cache                  # remembers every (input -> output) it has seen
def fib(n):
    return n if n < 2 else fib(n - 1) + fib(n - 2)
```

Naive `fib(35)`: seconds. Cached: instant. Same code — a decorator (Session 5!) did the work.
When a recursion re-solves the **same subproblem**, cache it.

---

## Divide & conquer: binary search

```python
def find(sorted_names, target, lo=0, hi=None):
    if hi is None:
        hi = len(sorted_names)
    if lo >= hi:
        return False                   # base case: empty range
    mid = (lo + hi) // 2
    if sorted_names[mid] == target:
        return True
    if sorted_names[mid] < target:
        return find(sorted_names, target, mid + 1, hi)
    return find(sorted_names, target, lo, mid)
```

Each call **halves** the problem: 1 000 names ≈ 10 steps, a million ≈ 20.
(Requires sorted data — Session 4's `sorted` earns its keep.)

---

## Tree-shaped data

```python
org = {"name": "Dean",
       "reports": [{"name": "Chair A", "reports": []},
                   {"name": "Chair B",
                    "reports": [{"name": "Prof C", "reports": []}]}]}

def count_people(node):
    return 1 + sum(count_people(r) for r in node["reports"])

count_people(org)      # 4
```

Org charts, folder trees, threaded replies, nested codes — the function's shape **mirrors the
data's shape**. That's the whole trick.

---

## Escaping the limit: an explicit stack

```python
def flatten_iter(xs):
    out, to_visit = [], list(xs)
    while to_visit:
        x = to_visit.pop(0)
        if isinstance(x, list):
            to_visit = x + to_visit    # open the box in place
        else:
            out.append(x)
    return out
```

Same logic, **no call-stack frames** — depth 10 000 is fine. When data may nest deeper than
~1000, carry your own to-visit list.

---

## Choosing: loop, recursion, or cache?

| Situation | Reach for |
|---|---|
| flat sequence | a plain **loop** |
| self-similar / nested data | **recursion** |
| repeated subproblems | recursion + **`@cache`** |
| possibly very deep | loop + **explicit stack** |

Recursion is a tool, not a virtue — pick by the *shape of the data*.

---

## Your turn — round 2

`examples/session-06/practice.md` → **In class — going deeper**:
binary search with a step counter, an org-tree count, and `flatten` without recursion.
---

## Traps recap

- Every recursion needs a **reachable base case**, or it overflows the stack.
- **Return** the recursive call — forgetting to gives you a silent `None`.
- Recursion isn't free: each call costs a stack frame (no tail-call optimization).
- A plain **loop** is better for flat sequences and for very deep work.

## Summary
You can solve problems that are defined in terms of themselves — especially nested data.

# 第 6 课
## 递归与递归思维

---

## 每个递归的模样

真实例子：一门课的先修链有多深？

```python
prereq_of = {"ED700": "ED600", "ED600": "ED500",
             "ED500": "ED400", "ED400": None}   # ED400 没有先修课

def prereqs_deep(course):
    earlier = prereq_of[course]
    if earlier is None:               # 基例 —— 到此停下
        return 0
    return 1 + prereqs_deep(earlier)  # 递归步 —— 往回退一门
```

永远是两部分：
- 一个**基例（base case）**负责停下，
- 一个**递归步（recursive case）**朝基例*靠近*。

---

## 追踪调用栈

`orderings(n)` = 给 *n* 名学生排名的方式数 = n!

```python
orderings(3)
= 3 * orderings(2)
=     3 * (2 * orderings(1))
=         3 * (2 * 1)          # 基例返回 1
= 6
```

每次调用都在等待它内部的那次调用。调用层层堆起，再层层返回。

🧠 每个未完成的调用是一个**栈帧**——马上就会用到这个概念。

---

## 递归 vs 迭代

```python
def orderings(n):                 # n 名学生的排名方式数（n!）
    if n <= 1:
        return 1
    return n * orderings(n - 1)   # ← 必须 RETURN 这次调用

def orderings_loop(n):
    total = 1
    for k in range(2, n + 1):
        total *= k
    return total
```

答案相同。对平铺的计数问题，**循环**通常更清晰。

---

## 递归的主场：嵌套数据

```python
def deep_sum(obj):
    if isinstance(obj, (int, float)):
        return obj
    if isinstance(obj, dict):
        return sum(deep_sum(v) for v in obj.values())
    if isinstance(obj, (list, tuple)):
        return sum(deep_sum(x) for x in obj)
    return 0

deep_sum([1, [2, [3, 4]], {"a": 6}])   # 16
```

嵌套 JSON、文件夹树、盖楼式回复——单层循环够不到底，递归可以。

---

## 陷阱：没有基例

```python
def runaway(n):
    return runaway(n + 1)     # 永不停止
```

```
RecursionError: maximum recursion depth exceeded
```

Python **没有尾调用优化**——每次调用都保留栈帧
（默认上限 ≈ 1000）。太深的递归*一定*会撞到天花板。

---

# 更进一步
## 荒野中的递归

---

## 记忆化：记住算过的调用

```python
def fib(n):                       # 朴素版：fib(35) 会把 fib(5) 重算几千次
    return n if n < 2 else fib(n - 1) + fib(n - 2)

import functools
@functools.cache                  # 记住每一对（输入 -> 输出）
def fib(n):
    return n if n < 2 else fib(n - 1) + fib(n - 2)
```

朴素版 `fib(35)`：数秒。加缓存：瞬间。代码没变——是装饰器（第 5 课！）干的活。
当递归会重复解**同一个子问题**时，缓存它。

---

## 分而治之：二分查找

```python
def find(sorted_names, target, lo=0, hi=None):
    if hi is None:
        hi = len(sorted_names)
    if lo >= hi:
        return False                   # 基例：区间空了
    mid = (lo + hi) // 2
    if sorted_names[mid] == target:
        return True
    if sorted_names[mid] < target:
        return find(sorted_names, target, mid + 1, hi)
    return find(sorted_names, target, lo, mid)
```

每次调用把问题**减半**：1 000 个名字 ≈ 10 步，一百万 ≈ 20 步。
（前提是数据有序——第 4 课的 `sorted` 派上用场。）

---

## 树形数据

```python
org = {"name": "Dean",
       "reports": [{"name": "Chair A", "reports": []},
                   {"name": "Chair B",
                    "reports": [{"name": "Prof C", "reports": []}]}]}

def count_people(node):
    return 1 + sum(count_people(r) for r in node["reports"])

count_people(org)      # 4
```

组织架构图、文件夹树、盖楼回复、层级编码——函数的形状**照着数据的形状长**。
诀窍全在这里。

---

## 逃出上限：显式栈

```python
def flatten_iter(xs):
    out, to_visit = [], list(xs)
    while to_visit:
        x = to_visit.pop(0)
        if isinstance(x, list):
            to_visit = x + to_visit    # 原地拆箱
        else:
            out.append(x)
    return out
```

逻辑相同，**没有调用栈帧**——嵌套一万层也没问题。数据可能深过
约 1000 层时，自备一个待访问列表。

---

## 怎么选：循环、递归，还是缓存？

| 场景 | 选它 |
|---|---|
| 平铺序列 | 普通**循环** |
| 自相似 / 嵌套数据 | **递归** |
| 重复的子问题 | 递归 + **`@cache`** |
| 可能非常深 | 循环 + **显式栈** |

递归是工具，不是美德——按*数据的形状*来挑。

---

## 轮到你了——第二轮

`examples/session-06/practice.md` → **In class — going deeper**：
带步数统计的二分查找、组织树计数，以及不用递归的 `flatten`。

---

## 陷阱回顾

- 每个递归都需要**可达的基例**，否则栈会溢出。
- 要 **return** 递归调用——忘了就得到悄无声息的 `None`。
- 递归不免费：每次调用占一个栈帧（没有尾调用优化）。
- 平铺序列和超深任务，用普通**循环**更好。

你已经能解决"以自身定义"的问题——尤其是嵌套数据。

### Quiz — Recursion & Recursive Thinking
1. What two parts must every recursive function have?
2. What error comes from a base case that's never reached, and why doesn't Python just
   keep going?
3. Why is recursion a natural fit for nested data (a list of lists, or nested JSON)?
4. The recursive case computes `n * f(n - 1)` but has no `return` in front — what does a
   call produce?
5. Naive recursive `fib(35)` takes seconds but `@functools.cache` makes it instant — what does the cache change?

<details><summary>Show answers</summary>

**Answers:** 1. A **base case** (stops) and a **recursive case** (calls itself on a
smaller input, *toward* the base case). 2. `RecursionError` — Python has no tail-call
optimization, so each pending call keeps a stack frame until the limit (~1000).
3. The data is *defined in terms of itself* (a list may contain lists), so a function
defined in terms of itself mirrors its shape and reaches every level. 4. `None` — the
value is computed and thrown away; the function falls off the end. 5. Each distinct input is computed once and remembered, so the exponential tree of repeated subcalls collapses into ~35 lookups.

</details>
</script>

### Quiz — 递归与递归思维
1. 每个递归函数必须有哪两部分？
2. 基例永远到不了会出什么错？Python 为什么不一直跑下去？
3. 递归为什么天然适合嵌套数据（列表套列表、嵌套 JSON）？
4. 递归步算了 `n * f(n - 1)` 但前面没写 `return`——调用会得到什么？
5. 朴素递归 `fib(35)` 要好几秒而 `@functools.cache` 让它瞬间完成——缓存改变了什么？

<details><summary>Show answers</summary>

**答案：** 1. **基例**（停下）和**递归步**（对更小的输入调用自己、*朝*基例走）。
2. `RecursionError`——Python 没有尾调用优化，每个未完成的调用都占一个栈帧，
到上限（约 1000）为止。3. 数据*以自身定义*（列表可以含列表），以自身定义的函数
与数据的形状互为镜像，能到达每一层。4. `None`——算出的值被丢弃；函数走到结尾
就返回了。5. 每个不同输入只算一次并被记住，指数级的重复子调用坍缩成约 35 次查表。

</details>
